<!doctype html>
<html lang="pt">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#075B35"
>

<title>
Kuanza Line — Compra. Vende. Confia.
</title>

<style>

:root{
--g:#12a34a;
--gd:#075b35;
--dark:#061a12;
--ink:#102018;
--muted:#718078;
--line:#dfe9e3;
--soft:#f1f7f3;
--y:#f4c400;
--red:#e94b35
}

*{
box-sizing:border-box
}

body{
margin:0;
background:#03130c;
color:var(--ink);
font-family:
Inter,
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif
}

.app{
max-width:560px;
margin:auto;
min-height:100vh;
background:#fff;
padding-bottom:82px
}

.top{
position:sticky;
top:0;
z-index:20;
background:rgba(255,255,255,.96);
backdrop-filter:blur(12px);
padding:14px 16px 10px;
border-bottom:1px solid var(--line)
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.logo{
width:40px;
height:40px;
border-radius:13px;
background:
linear-gradient(
135deg,
#f4d500,
#10a34a 62%,
#075b35
);
color:#fff;
display:grid;
place-items:center;
font-weight:1000;
font-size:27px;
box-shadow:
0 8px 20px #0a8a4530
}

.brand b{
font-size:20px;
letter-spacing:-.5px
}

.brand span{
color:var(--g)
}

.tag{
font-size:10px;
color:var(--muted);
font-weight:800
}

.bell{
margin-left:auto;
width:40px;
height:40px;
border:1px solid var(--line);
background:#fff;
border-radius:13px;
position:relative;
font-size:19px
}

.badge{
position:absolute;
right:-2px;
top:-3px;
background:var(--red);
color:#fff;
border-radius:99px;
font-size:9px;
min-width:17px;
height:17px;
display:grid;
place-items:center;
font-weight:900
}

.page{
display:none;
padding:14px 15px
}

.page.on{
display:block
}

.search{
display:flex;
gap:8px;
margin:5px 0 13px
}

.search input{
flex:1;
padding:13px 15px;
border:1px solid var(--line);
border-radius:15px;
outline:0;
background:#f8fbf9
}

.iconbtn,
.btn{
border:0;
border-radius:13px;
padding:12px 14px;
font-weight:900
}

.iconbtn{
background:var(--soft)
}

.btn{
background:var(--g);
color:#fff
}

.btn.dark{
background:var(--dark)
}

.btn.light{
background:#fff;
color:var(--gd);
border:1px solid #b9d7c6
}

.hero{
background:
linear-gradient(
135deg,
var(--gd),
#0a9b49
);
color:#fff;
border-radius:23px;
padding:20px;
margin-bottom:15px;
overflow:hidden
}

.hero h1{
font-size:26px;
margin:0 0 7px
}

.hero p{
margin:0 0 14px;
color:#e3f6ea;
font-size:13px
}

.quick{
display:grid;
grid-template-columns:
repeat(5,1fr);
gap:8px;
margin:8px 0 18px
}

.quick button{
border:0;
background:#fff;
border-radius:15px;
padding:10px 4px;
font-size:10px;
font-weight:900;
color:#27352e;
box-shadow:
0 5px 18px #0a3b2510
}

.quick i{
font-style:normal;
display:block;
font-size:21px;
margin-bottom:4px
}

.head{
display:flex;
justify-content:space-between;
align-items:center;
margin:14px 1px 10px
}

.head h2,
.head h3{
margin:0
}

.link{
border:0;
background:transparent;
color:var(--g);
font-weight:900
}

.grid{
display:grid;
grid-template-columns:
1fr 1fr;
gap:10px
}

.product{
border:1px solid var(--line);
border-radius:17px;
overflow:hidden;
background:#fff
}

.pimg{
height:145px;
background:
linear-gradient(
135deg,
#edf6f0,
#fff
);
position:relative;
display:grid;
place-items:center;
overflow:hidden
}

.pimg img{
width:100%;
height:100%;
object-fit:cover
}

.pemoji{
font-size:58px
}

.heart{
position:absolute;
right:8px;
top:8px;
border:0;
background:#fff;
border-radius:99px;
width:32px;
height:32px;
font-size:18px
}

.info{
padding:10px
}

.name{
font-weight:900;
font-size:13px;
line-height:1.2
}

.price{
color:var(--g);
font-weight:1000;
margin-top:5px
}

.muted{
color:var(--muted);
font-size:11px
}

.verify{
color:var(--g);
font-weight:900
}

.rating{
font-size:11px;
margin:4px 0
}

.chiprow{
display:flex;
gap:7px;
overflow:auto;
padding-bottom:3px
}

.chip{
white-space:nowrap;
border:1px solid var(--line);
background:#fff;
border-radius:99px;
padding:9px 12px;
font-weight:800;
font-size:11px
}

.chip.sel{
background:var(--gd);
color:#fff;
border-color:var(--gd)
}

.panel{
border:1px solid var(--line);
border-radius:18px;
padding:15px;
margin:10px 0
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.form{
display:grid;
gap:10px
}

.form label{
font-size:11px;
font-weight:900
}

.form input,
.form select,
.form textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:13px;
outline:0;
font:inherit;
background:#fbfdfc
}

.form textarea{
min-height:105px;
resize:vertical
}

.photos{
display:grid;
grid-template-columns:
repeat(5,1fr);
gap:7px
}

.slot{
aspect-ratio:1;
border:1.5px dashed #9cc5aa;
border-radius:12px;
background:#f4faf6;
display:grid;
place-items:center;
overflow:hidden;
position:relative
}

.slot img{
width:100%;
height:100%;
object-fit:cover
}

.slot b{
font-size:22px;
color:var(--g)
}

.slot small{
position:absolute;
bottom:3px;
left:0;
right:0;
text-align:center;
background:#0008;
color:#fff;
font-size:8px
}

.notice{
padding:10px 12px;
background:#eef9f1;
border-radius:12px;
color:#176238;
font-size:11px;
font-weight:800
}

.scorebox{
background:
linear-gradient(
135deg,
#eaf9ee,
#fff
);
border:1px solid #bde0c9;
border-radius:18px;
padding:15px
}

.score{
font-size:38px;
color:var(--g);
font-weight:1000
}

.progress{
height:9px;
background:#dcebe2;
border-radius:99px;
overflow:hidden
}

.progress span{
display:block;
height:100%;
background:var(--g)
}

.status{
display:inline-block;
border-radius:99px;
padding:5px 8px;
background:#eef8f1;
color:#13753d;
font-size:10px;
font-weight:900
}

.storeHero{
border-radius:20px;
background:
linear-gradient(
135deg,
#063d25,
#0da04b
);
color:#fff;
padding:16px
}

.storeLogo{
width:58px;
height:58px;
border-radius:18px;
background:#fff;
color:var(--gd);
display:grid;
place-items:center;
font-size:25px;
font-weight:1000;
overflow:hidden
}

.storeLogo img{
width:100%;
height:100%;
object-fit:cover
}

.gallery{
display:grid;
grid-template-columns:
2fr 1fr 1fr;
grid-template-rows:
120px 120px;
gap:5px;
border-radius:18px;
overflow:hidden;
margin-bottom:12px
}

.gallery div{
background:#eef6f0;
overflow:hidden
}

.gallery div:first-child{
grid-row:span 2
}

.gallery img{
width:100%;
height:100%;
object-fit:cover
}

.detailcard{
padding:15px;
border:1px solid var(--line);
border-radius:18px
}

.chatlist{
display:grid;
gap:9px
}

.chatitem{
display:flex;
gap:10px;
padding:12px;
border:1px solid var(--line);
border-radius:15px;
background:#fff
}

.avatar{
width:45px;
height:45px;
border-radius:14px;
background:#e7f5ec;
display:grid;
place-items:center;
font-size:21px;
font-weight:900
}

.bubble{
max-width:80%;
padding:10px 12px;
border-radius:15px;
background:#edf6f0;
font-size:12px
}

.mine{
margin-left:auto;
background:#0b8744;
color:#fff
}

.chatmsgs{
height:55vh;
overflow:auto;
padding:10px 0;
display:flex;
flex-direction:column;
gap:8px
}

.chatbar{
position:sticky;
bottom:0;
background:#fff;
border-top:1px solid var(--line);
padding:9px 0;
display:flex;
gap:7px
}

.chatbar input{
flex:1;
border:1px solid var(--line);
border-radius:14px;
padding:12px
}

.offer{
border:1px solid #b8dfc5;
background:#f1faf4;
border-radius:14px;
padding:10px;
font-weight:900
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(560px,100%);
z-index:30;
background:#fff;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:
repeat(5,1fr);
padding:
7px 4px
calc(7px + env(safe-area-inset-bottom));
box-shadow:
0 -8px 25px #001a0d10
}

.nav{
border:0;
background:#fff;
color:#66736c;
font-size:9px;
font-weight:800
}

.nav i{
font-style:normal;
font-size:20px;
display:block
}

.nav.active{
color:var(--g)
}

.hidden{
display:none!important
}

.empty{
text-align:center;
padding:28px;
color:var(--muted)
}

.modal{
position:fixed;
inset:0;
background:#001a0d88;
z-index:50;
display:none;
align-items:flex-end
}

.modal.show{
display:flex
}

.sheet{
width:min(560px,100%);
max-height:92vh;
overflow:auto;
background:#fff;
border-radius:25px 25px 0 0;
padding:15px
}

.close{
float:right;
border:0;
background:#edf5ef;
border-radius:99px;
width:35px;
height:35px
}

.two{
display:grid;
grid-template-columns:
1fr 1fr;
gap:8px
}

.small{
font-size:10px
}

.order{
border:1px solid var(--line);
border-radius:16px;
padding:12px;
margin:8px 0
}

.toast{
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
background:#102018;
color:#fff;
padding:11px 15px;
border-radius:13px;
z-index:100;
display:none;
font-size:12px;
font-weight:800
}

.toast.on{
display:block
}

@media(min-width:700px){

body{
padding:20px 0
}

.app{
border-radius:28px;
overflow:hidden;
box-shadow:
0 20px 60px #0005
}

}

</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">

<div class="logo">
K
</div>

<div>
<b>
KUANZA <span>LINE</span>
</b>

<div class="tag">
Compra. Vende. Confia.
</div>
</div>

<button
class="bell"
onclick="showNotifications()"
>
🔔
<span
id="notifBadge"
class="badge"
>
0
</span>
</button>

</div>

</header>

<main>

<section
id="home"
class="page on"
>

<div class="search">

<input
id="q"
placeholder="O que estás à procura?"
oninput="loadProducts()"
>

<button
class="iconbtn"
onclick="loadProducts()"
>

<button
class="btn light"

>

</button>

</div>

>
<i>▦</i>

</button>

<button
onclick="go('store')"
>
<i>🏪</i>
Lojas
</button>

onclick="go('favorites')"
>

</button>

onclick="go('cart')"
>

Carrinho
</button>

onclick="go('seller')"
>
<i>▥</i>
Vendedor
</button>

Em destaque
</h3>

class="link"
onclick="go('explore')"
>
Ver todos
</button>

<div
id="homeProducts"
class="grid"
></div>

</section>


<section
id="explore"
class="page"
>

<div class="head">

<h3>
🔎 Explorar
</h3>

<select
id="sort"
onchange="loadProducts()"
style="
border:1px solid var(--line);
border-radius:10px;
padding:8px
"
>

<option value="">

</option>

</option>

</option>

<input
id="eq"
placeholder="Pesquisar produtos ou lojas"
oninput="loadProducts()"
>

</div>

<div
id="cats"

></div>

id="exploreProducts"

style="margin-top:12px"

<section
id="product"

>

<div id="productBox"></div>

</section>


<section
id="store"
class="page"
>

<div id="storeBox"></div>

</section>


<section
id="favorites"
class="page"
>

<div class="head">
<h3>
♥ Meus favoritos
</h3>
</div>

<div id="favBox"></div>

</section>


<section
id="cart"
class="page"
>

<div class="head">
<h3>
🛒 Meu carrinho
</h3>
</div>

<div id="cartBox"></div>

</section>


<section
id="account"
class="page"
>

<div id="accountBox"></div>

</section>

>

<div id="sellerBox"></div>

</section>


<section

>

📦 Meus pedidos

</div>

<section
id="chats"

>

>

</main>


<nav class="bottom">

<button
class="nav active"
data-p="home"
onclick="go('home')"
>
<i>⌂</i>
Início
</button>

<button
class="nav"
data-p="explore"
onclick="go('explore')"
>
<i>▦</i>
Categorias
</button>

<button
class="nav"
data-p="favorites"
onclick="go('favorites')"
>
<i>♡</i>
Favoritos
</button>

<button
class="nav"
data-p="cart"
onclick="go('cart')"
>
<i>🛒</i>
Carrinho

data-p="account"

Perfil

>
✕
</button>

<div id="modalBody"></div>

</div>

<div
id="toast"
class="toast"
></div>


<script>

let token=
localStorage.klToken||'';

let me=null;

let currentProduct=null;

let currentConversation=null;

let activeCat='Todos';

let photoData=[];


const $=
id=>document.getElementById(id);


const money=
n=>
new Intl.NumberFormat('pt-PT')
.format(Number(n)||0)+' Kz';


const esc=
v=>
String(v??'')
.replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);


async function api(p,o={}){

const h={
'Content-Type':
'application/json'
};

if(token)
h.Authorization=
'Bearer '+token;

const r=
await fetch(
p,
{
...o,
headers:{
...h,
...(o.headers||{})
}
}
);

const t=
await r.text();

let d={};

try{
d=t?JSON.parse(t):{};
}catch{
d={
error:t
};
}

if(!r.ok)
throw Error(
d.error||'Erro'
);

return d;

}


function toast(t){

$('toast').textContent=t;

$('toast')
.classList
.add('on');

setTimeout(
()=>
$('toast')
.classList
.remove('on'),
2400
);

}


function go(id){

document
.querySelectorAll('.page')
.forEach(
x=>
x.classList.toggle(
'on',
x.id===id
)
);

document
.querySelectorAll('.nav')
.forEach(
x=>
x.classList.toggle(
'active',
x.dataset.p===id
)
);

if(id==='home')
loadProducts();

if(id==='explore'){
renderCats();
loadProducts();
}

if(id==='favorites')
loadFavorites();

if(id==='cart')
loadCart();

if(id==='account')
loadAccount();

if(id==='seller')
loadSeller();

if(id==='orders')
loadOrders();

if(id==='chats')
loadChats();

scrollTo(0,0);

}


function renderCats(){

const cats=[
'Todos',
'Eletrónicos',
'Moda',
'Casa',
'Beleza',
'Automóveis',
'Outros'
];

$('cats').innerHTML=
cats
.map(
c=>
`
<button
class="chip ${c===activeCat?'sel':''}"
onclick="filterCat('${c}')"
>
${c}
</button>
`
)
.join('');

}


function filterCat(c){

activeCat=c;

renderCats();

loadProducts();

}


async function loadProducts(){

try{

const q=
$('explore')
?.classList
.contains('on')
?
($('eq')?.value||'')
:
($('q')?.value||'');

const sort=
$('sort')?.value||'';

const ps=
await api(
'/api/products?search='+
encodeURIComponent(q)+
'&cat='+
encodeURIComponent(activeCat)+
'&sort='+
encodeURIComponent(sort)
);

const html=
ps
.map(card)
.join('')||
`
<div
class="empty"
style="grid-column:1/-1"
>
Nenhum produto encontrado.
</div>
`;

$('homeProducts')
.innerHTML=
ps
.slice(0,6)
.map(card)
.join('')||
`
<div
class="empty"
style="grid-column:1/-1"
>
Nenhum produto encontrado.
</div>
`;

$('exploreProducts')
.innerHTML=html;

}catch(e){

console.log(e);

}

}


function card(p){

const img=
p.photos?.[0]
?
`
<img
src="${p.photos[0]}"
alt=""
>
`
:
`
<div class="pemoji">
${esc(p.emoji||'📦')}
</div>
`;

return `

<article
class="product"
onclick="openProduct('${p.id}')"
>

<div class="pimg">

${img}

<button
class="heart"
onclick="
event.stopPropagation();
toggleFav('${p.id}',this)
"
>
♡
</button>

</div>

<div class="info">

<div class="name">
${esc(p.name)}
</div>

<div class="price">
${money(p.price)}
</div>

<div class="muted">
${esc(p.seller)}
${p.verified?
'<span class="verify">✓</span>':
''}
</div>

<div class="rating">
⭐ ${p.rating||5}
·
<span class="verify">
Kuanza ${p.score||100}/100
</span>
</div>

</div>

</article>

`;

}


async function openProduct(id){

try{

currentProduct=
await api(
'/api/products/'+id
);

renderProduct();

}catch(e){

toast(e.message);

}

}


function renderProduct(){

const p=
currentProduct;

const photos=
p.photos||[];

let gal=
photos.slice(0,5);

while(gal.length<5)
gal.push(null);

$('productBox').innerHTML=

`

<button
class="link"
onclick="go('explore')"
>
‹ Voltar
</button>

<div class="gallery">

${gal
.map(
(x,i)=>
`
<div>

${
x
?
`
<img
src="${x}"
alt="Foto ${i+1}"
>
`
:
`
<div class="pemoji">
${esc(p.emoji||'📦')}
</div>
`
}

</div>
`
)
.join('')}

</div>


<div class="detailcard">

<span class="status">
✓ ${photos.length} fotos reais
</span>

<h2>
${esc(p.name)}
</h2>

<div
class="price"
style="font-size:25px"
>
${money(p.price)}

function handlePhotos(e){

const files=
[...e.target.files]
.slice(0,10);

photoData=[];

let done=0;

if(!files.length){
renderPhotoSlots();
return;
}

files.forEach(f=>{

const r=
new FileReader();

r.onload=()=>{

const img=
new Image();

img.onload=()=>{

const c=
document.createElement('canvas');

const max=1000;

const scale=
Math.min(
1,
max/
Math.max(
img.width,
img.height
)
);

c.width=
Math.max(
1,
Math.round(
img.width*scale
)
);

c.height=
Math.max(
1,
Math.round(
img.height*scale
)
);

c
.getContext('2d')
.drawImage(
img,
0,
0,
c.width,
c.height
);

photoData.push(
c.toDataURL(
'image/jpeg',
.72
)
);

done++;

if(done===files.length){

photoData=
photoData.slice(0,10);

renderPhotoSlots();

}

};

img.src=r.result;

};

r.readAsDataURL(f);

});

}


function renderPhotoSlots(){

return;

$('photoCount').textContent=
photoData.length+

$('photoGrid').innerHTML=

Math.max(
5,

)
},

`

${

`

src="${photoData[i]}"

<small>
${i+1}
</small>
`
:
`
<b>
+
</b>
`
}

</div>

`
)
.join('');

}
