<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><title>Kuanza Line V0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f5;font-family:Inter,system-ui,-apple-system,sans-serif;color:#111827}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:18px 16px 40px}.brand{font-weight:900;font-size:21px}.brand span{color:#16A34A}.tag{color:#6b7280;font-size:12px;margin:3px 0 18px}.hero{background:#16A34A;color:white;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border:1px solid #e5e7eb;border-radius:15px;overflow:hidden}.pic{height:130px;background:#f0f5f1;display:grid;place-items:center;font-size:52px}.p{padding:10px}.price{font-weight:900;color:#16A34A;margin-top:5px}.muted{color:#6b7280;font-size:12px}.form{display:grid;gap:9px}.form input,.form select{padding:12px;border:1px solid #ddd;border-radius:11px}.btn{background:#16A34A;color:white;border:0;border-radius:11px;padding:12px 15px;font-weight:800}.btn.alt{background:#111827}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px}.hidden{display:none}.status{display:inline-block;background:#eaf7ef;color:#087a3c;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}</style><div class="app"><div class="brand">KUANZA <span>LINE</span></div><div class="tag">Compra. Vende. Confia. · V0.7</div><div class="hero"><h1>Agora temos uma API real.</h1><div>Contas, produtos e pedidos passam a comunicar com um backend local.</div></div><div class="tabs"><button onclick="view('home')">Produtos</button><button onclick="view('auth')">Conta</button><button onclick="view('sell')">Vender</button><button onclick="view('orders')">Pedidos</button></div><section id="home"><h2>Produtos</h2><div id="products" class="grid"></div></section><section id="auth" class="hidden"><div class="card"><h2 id="authTitle">Criar conta</h2><form class="form" onsubmit="register(event)"><input id="name" placeholder="Nome" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Palavra-passe" required><select id="role"><option value="buyer">Quero comprar</option><option value="seller">Quero vender</option></select><button class="btn">Criar conta</button></form><p class="muted">Já tens conta? <button onclick="loginMode()">Entrar</button></p><div id="me"></div></div></section><section id="sell" class="hidden"><div class="card"><h2>Publicar produto</h2><form class="form" onsubmit="publish(event)"><input id="pn" placeholder="Nome do produto" required><input id="pp" type="number" placeholder="Preço em Kz" required><select id="pc"><option>Eletrónicos</option><option>Moda</option><option>Casa</option><option>Beleza</option><option>Automóveis</option></select><input id="pe" placeholder="Emoji, ex.: 📱"><button class="btn">Publicar</button></form></div></section><section id="orders" class="hidden"><div class="card"><h2>Pedidos</h2><div id="orderList">Inicia sessão para consultar pedidos.</div></div></section></div><script>
let token=localStorage.klToken||'';const $=id=>document.getElementById(id);function view(x){['home','auth','sell','orders'].forEach(i=>$(i).classList.toggle('hidden',i!==x));if(x==='orders')loadOrders()}async function api(p,o={}){let h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;let r=await fetch(p,{...o,headers:h});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}async function load(){let ps=await api('/api/products');$('products').innerHTML=ps.map(p=>`<div class="product"><div class="pic">${p.emoji}</div><div class="p"><b>${p.name}</b><div class="price">${new Intl.NumberFormat('pt-PT').format(p.price)} Kz</div><div class="muted">${p.seller} ${p.verified?'✓':''}</div><button class="btn" style="margin-top:8px;width:100%" onclick="buy('${p.id}',${p.price})">Comprar</button></div></div>`).join('')}async function register(e){e.preventDefault();try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,role:$('role').value})});token=d.token;localStorage.klToken=token;$('me').innerHTML='<p class="status">Conta criada e sessão iniciada ✓</p>';alert('Conta criada!')}catch(x){alert(x.message)}}function loginMode(){let e=new Event('submit');let f=$('auth').querySelector('form');f.onsubmit=async ev=>{ev.preventDefault();try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.klToken=token;$('me').innerHTML='<p class="status">Sessão iniciada ✓</p>'}catch(x){alert(x.message)}};$('authTitle').textContent='Entrar';$('name').required=false;$('role').required=false;f.querySelector('button').textContent='Entrar'}async function publish(e){e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pn').value,price:$('pp').value,cat:$('pc').value,emoji:$('pe').value||'📦'})});alert('Produto publicado!');e.target.reset();load();view('home')}catch(x){alert(x.message)}}async function buy(id,price){try{await api('/api/orders',{method:'POST',body:JSON.stringify({items:[{id,qty:1}],total:price})});alert('Pedido criado!')}catch(x){alert(x.message)}}async function loadOrders(){try{let os=await api('/api/orders');$('orderList').innerHTML=os.length?os.map(o=>`<div class="card"><b>#${o.id}</b><br><span class="status">${o.status}</span><div class="muted">Total: ${new Intl.NumberFormat('pt-PT').format(o.total)} Kz</div></div>`).join(''):'Nenhum pedido.'}catch(x){$('orderList').textContent=x.message}}load();</script></html>
