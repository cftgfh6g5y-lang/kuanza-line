<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075B35">
<title>Kuanza Line — Compra. Vende. Confia.</title>

<style>
:root{
--g:#12a34a;
--gd:#075b35;
--dark:#061a12;
--ink:#102018;
--muted:#718078;
--line:#dfe9e3;
--soft:#f1f7f3;
--y:#f4c400;
--red:#e94b35;
}

*{box-sizing:border-box}

body{
margin:0;
background:#03130c;
color:var(--ink);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.app{
max-width:560px;
margin:auto;
min-height:100vh;
background:#fff;
padding-bottom:82px
}

.top{
position:sticky;
top:0;
z-index:20;
background:rgba(255,255,255,.96);
backdrop-filter:blur(12px);
padding:14px 16px 10px;
border-bottom:1px solid var(--line)
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.logo{
width:40px;
height:40px;
border-radius:13px;
background:linear-gradient(135deg,#f4d500,#10a34a 62%,#075b35);
color:#fff;
display:grid;
place-items:center;
font-weight:1000;
font-size:27px;
box-shadow:0 8px 20px #0a8a4530
}

.brand b{
font-size:20px;
letter-spacing:-.5px
}

.brand span{color:var(--g)}

.tag{
font-size:10px;
color:var(--muted);
font-weight:800
}

.bell{
margin-left:auto;
width:40px;
height:40px;
border:1px solid var(--line);
background:#fff;
border-radius:13px;
position:relative;
font-size:19px
}

.badge{
position:absolute;
right:-2px;
top:-3px;
background:var(--red);
color:#fff;
border-radius:99px;
font-size:9px;
min-width:17px;
height:17px;
display:grid;
place-items:center;
font-weight:900
}

.page{
display:none;
padding:14px 15px
}

.page.on{display:block}

.search{
display:flex;
gap:8px;
margin:5px 0 13px
}

.search input{
flex:1;
padding:13px 15px;
border:1px solid var(--line);
border-radius:15px;
outline:0;
background:#f8fbf9
}

.iconbtn,.btn{
border:0;
border-radius:13px;
padding:12px 14px;
font-weight:900
}

.iconbtn{background:var(--soft)}

.btn{
background:var(--g);
color:#fff
}

.btn.dark{background:var(--dark)}

.btn.light{
background:#fff;
color:var(--gd);
border:1px solid #b9d7c6
}

.btn.yellow{
background:var(--y);
color:#17201b
}

.btn.danger{
background:#ffe7e4;
color:#b52c20
}

.btn:disabled{
opacity:.5;
cursor:not-allowed
}

.hero{
background:linear-gradient(135deg,var(--gd),#0a9b49);
color:#fff;
border-radius:23px;
padding:20px;
margin-bottom:15px;
overflow:hidden
}

.hero h1{
font-size:26px;
margin:0 0 7px
}

.hero p{
margin:0 0 14px;
color:#e3f6ea;
font-size:13px
}

.quick{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin:8px 0 18px
}

.quick button{
border:0;
background:#fff;
border-radius:15px;
padding:10px 4px;
font-size:10px;
font-weight:900;
color:#27352e;
box-shadow:0 5px 18px #0a3b2510
}

.quick i{
font-style:normal;
display:block;
font-size:21px;
margin-bottom:4px
}

.head{
display:flex;
justify-content:space-between;
align-items:center;
margin:14px 1px 10px
}

.head h2,.head h3{
margin:0
}

.link{
border:0;
background:transparent;
color:var(--g);
font-weight:900
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.product{
border:1px solid var(--line);
border-radius:17px;
overflow:hidden;
background:#fff
}

.pimg{
height:145px;
background:linear-gradient(135deg,#edf6f0,#fff);
position:relative;
display:grid;
place-items:center;
overflow:hidden
}

.pimg img{
width:100%;
height:100%;
object-fit:cover
}

.pemoji{font-size:58px}

.heart{
position:absolute;
right:8px;
top:8px;
border:0;
background:#fff;
border-radius:99px;
width:32px;
height:32px;
font-size:18px
}

.info{padding:10px}

.name{
font-weight:900;
font-size:13px;
line-height:1.2
}

.price{
color:var(--g);
font-weight:1000;
margin-top:5px
}

.muted{
color:var(--muted);
font-size:11px
}

.verify{
color:var(--g);
font-weight:900
}

.rating{
font-size:11px;
margin:4px 0
}

.chiprow{
display:flex;
gap:7px;
overflow:auto;
padding-bottom:3px
}

.chip{
white-space:nowrap;
border:1px solid var(--line);
background:#fff;
border-radius:99px;
padding:9px 12px;
font-weight:800;
font-size:11px
}

.chip.sel{
background:var(--gd);
color:#fff;
border-color:var(--gd)
}

.panel{
border:1px solid var(--line);
border-radius:18px;
padding:15px;
margin:10px 0
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.form{
display:grid;
gap:10px
}

.form label{
font-size:11px;
font-weight:900
}

.form input,
.form select,
.form textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:13px;
outline:0;
font:inherit;
background:#fbfdfc
}

.form textarea{
min-height:105px;
resize:vertical
}

.photos{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px
}

.slot{
aspect-ratio:1;
border:1.5px dashed #9cc5aa;
border-radius:12px;
background:#f4faf6;
display:grid;
place-items:center;
overflow:hidden;
position:relative
}

.slot img{
width:100%;
height:100%;
object-fit:cover
}

.slot b{
font-size:22px;
color:var(--g)
}

.slot small{
position:absolute;
bottom:3px;
left:0;
right:0;
text-align:center;
background:#0008;
color:#fff;
font-size:8px
}

.notice{
padding:10px 12px;
background:#eef9f1;
border-radius:12px;
color:#176238;
font-size:11px;
font-weight:800
}

.scorebox{
background:linear-gradient(135deg,#eaf9ee,#fff);
border:1px solid #bde0c9;
border-radius:18px;
padding:15px
}

.score{
font-size:38px;
color:var(--g);
font-weight:1000
}

.progress{
height:9px;
background:#dcebe2;
border-radius:99px;
overflow:hidden
}

.progress span{
display:block;
height:100%;
background:var(--g);
width:0
}

.status{
display:inline-block;
border-radius:99px;
padding:5px 8px;
background:#eef8f1;
color:#13753d;
font-size:10px;
font-weight:900
}

.storeHero{
border-radius:20px;
background:linear-gradient(135deg,#063d25,#0da04b);
color:#fff;
padding:16px
}

.storeLogo{
width:58px;
height:58px;
border-radius:18px;
background:#fff;
color:var(--gd);
display:grid;
place-items:center;
font-size:25px;
font-weight:1000;
overflow:hidden
}

.storeLogo img{
width:100%;
height:100%;
object-fit:cover
}

.gallery{
display:grid;
grid-template-columns:2fr 1fr 1fr;
grid-template-rows:120px 120px;
gap:5px;
border-radius:18px;
overflow:hidden;
margin-bottom:12px
}

.gallery div{
background:#eef6f0;
overflow:hidden
}

.gallery div:first-child{
grid-row:span 2
}

.gallery img{
width:100%;
height:100%;
object-fit:cover
}

.detailcard{
padding:15px;
border:1px solid var(--line);
border-radius:18px
}

.chatlist{
display:grid;
gap:9px
}

.chatitem{
display:flex;
gap:10px;
padding:12px;
border:1px solid var(--line);
border-radius:15px;
background:#fff
}

.avatar{
width:45px;
height:45px;
border-radius:14px;
background:#e7f5ec;
display:grid;
place-items:center;
font-size:21px;
font-weight:900
}

.bubble{
max-width:80%;
padding:10px 12px;
border-radius:15px;
background:#edf6f0;
font-size:12px
}

.mine{
margin-left:auto;
background:#0b8744;
color:#fff
}

.chatmsgs{
height:55vh;
overflow:auto;
padding:10px 0;
display:flex;
flex-direction:column;
gap:8px
}

.chatbar{
position:sticky;
bottom:0;
background:#fff;
border-top:1px solid var(--line);
padding:9px 0;
display:flex;
gap:7px
}

.chatbar input{
flex:1;
border:1px solid var(--line);
border-radius:14px;
padding:12px
}

.offer{
border:1px solid #b8dfc5;
background:#f1faf4;
border-radius:14px;
padding:10px;
font-weight:900
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(560px,100%);
z-index:30;
background:#fff;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(5,1fr);
padding:7px 4px calc(7px + env(safe-area-inset-bottom));
box-shadow:0 -8px 25px #001a0d10
}

.nav{
border:0;
background:#fff;
color:#66736c;
font-size:9px;
font-weight:800
}

.nav i{
font-style:normal;
font-size:20px;
display:block
}

.nav.active{
color:var(--g)
}

.empty{
text-align:center;
padding:28px;
color:var(--muted)
}

.modal{
position:fixed;
inset:0;
background:#001a0d88;
z-index:50;
display:none;
align-items:flex-end
}

.modal.show{display:flex}

.sheet{
width:min(560px,100%);
max-height:92vh;
overflow:auto;
background:#fff;
border-radius:25px 25px 0 0;
padding:15px
}

.close{
float:right;
border:0;
background:#edf5ef;
border-radius:99px;
width:35px;
height:35px
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.dangerText{
color:#c83425
}

.small{
font-size:10px
}

.tabs2{
display:flex;
gap:7px;
overflow:auto;
margin:8px 0
}

.tabs2 button{
white-space:nowrap;
border:1px solid var(--line);
background:#fff;
border-radius:99px;
padding:8px 11px;
font-size:10px;
font-weight:800
}

.tabs2 button.on{
background:var(--gd);
color:#fff
}

/* =========================
   SELLER DASHBOARD
========================= */

.dashboardHero{
background:linear-gradient(135deg,#063d25,#0da04b);
color:#fff;
border-radius:20px;
padding:18px;
margin-bottom:12px
}

.dashboardHero h2{
margin:0 0 5px;
font-size:22px
}

.dashboardHero p{
margin:0;
font-size:11px;
opacity:.9
}

.dashboardPeriod{
display:flex;
gap:7px;
overflow:auto;
margin:12px 0
}

.dashboardPeriod button{
white-space:nowrap;
border:1px solid var(--line);
background:#fff;
border-radius:99px;
padding:9px 13px;
font-size:10px;
font-weight:900
}

.dashboardPeriod button.active{
background:var(--gd);
color:#fff;
border-color:var(--gd)
}

.metrics{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.metric{
border:1px solid var(--line);
border-radius:17px;
padding:13px;
background:#fff
}

.metric .icon{
font-size:19px;
margin-bottom:7px
}

.metric .label{
font-size:10px;
color:var(--muted);
font-weight:800
}

.metric .value{
font-size:17px;
font-weight:1000;
color:var(--ink);
margin-top:4px;
line-height:1.2
}

.metric.green .value{
color:var(--g)
}

.metric.red .value{
color:var(--red)
}

.wallet{
background:linear-gradient(135deg,#f0faf4,#fff);
border:1px solid #b9ddc7;
border-radius:20px;
padding:16px;
margin-top:10px
}

.walletTitle{
font-weight:1000;
font-size:15px;
margin-bottom:4px
}

.walletBalance{
font-size:29px;
font-weight:1000;
color:var(--g);
margin:7px 0
}

.walletInfo{
font-size:10px;
color:var(--muted);
line-height:1.45
}

.chart{
height:190px;
border:1px solid var(--line);
border-radius:18px;
padding:15px;
display:flex;
align-items:flex-end;
gap:7px;
overflow:hidden;
background:#fff
}

.barWrap{
height:150px;
flex:1;
display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;
gap:5px;
min-width:22px
}

.bar{
width:100%;
max-width:35px;
background:linear-gradient(180deg,#12a34a,#075b35);
border-radius:7px 7px 2px 2px;
min-height:3px
}

.barLabel{
font-size:8px;
color:var(--muted);
white-space:nowrap
}

.topProduct{
display:flex;
align-items:center;
gap:10px;
padding:11px 0;
border-bottom:1px solid var(--line)
}

.topProduct:last-child{
border-bottom:0
}

.rank{
width:27px;
height:27px;
border-radius:9px;
background:#eaf7ef;
display:grid;
place-items:center;
font-weight:1000;
color:var(--g)
}

.topProductInfo{
flex:1
}

.topProductName{
font-size:12px;
font-weight:900
}

.topProductMeta{
font-size:10px;
color:var(--muted);
margin-top:3px
}

.topProductValue{
font-size:11px;
font-weight:1000;
color:var(--g)
}

.sellerOrder{
border:1px solid var(--line);
border-radius:17px;
padding:13px;
margin:9px 0;
background:#fff
}

.sellerOrderHead{
display:flex;
justify-content:space-between;
gap:8px
}

.sellerOrder select{
margin-top:9px;
width:100%;
padding:10px;
border:1px solid var(--line);
border-radius:11px;
background:#fff
}

.historyRow{
padding:11px 0;
border-bottom:1px solid var(--line)
}

.historyRow:last-child{
border-bottom:0
}

.historyMain{
display:flex;
justify-content:space-between;
gap:10px
}

.historyName{
font-size:11px;
font-weight:900
}

.historyAmount{
font-size:11px;
font-weight:1000;
color:var(--g)
}

.historyMeta{
font-size:9px;
color:var(--muted);
margin-top:4px
}

.sectionTitle{
font-size:15px;
font-weight:1000;
margin:18px 0 9px
}

.commissionNote{
font-size:10px;
background:#fff8d9;
border:1px solid #f0dd8a;
padding:9px 11px;
border-radius:11px;
line-height:1.4;
margin-top:8px
}

@media(min-width:700px){
body{padding:20px 0}
.app{
border-radius:28px;
overflow:hidden;
box-shadow:0 20px 60px #0005
}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
<div class="brand">

<div class="logo">K</div>

<div>
<b>KUANZA <span>LINE</span></b>
<div class="tag">Compra. Vende. Confia.</div>
</div>

<button class="bell" onclick="showNotifications()">
🔔
<span id="notifBadge" class="badge">0</span>
</button>

</div>
</header>


<main>

<!-- HOME -->

<section id="home" class="page on">

<div class="search">

<input
id="q"
placeholder="O que estás à procura?"
oninput="loadProducts()">

<button class="iconbtn" onclick="loadProducts()">⌕</button>

</div>


<div class="hero">

<h1>Compra com confiança.</h1>

<p>
Produtos reais, vendedores verificados
e uma experiência feita para Angola.
</p>

<button
class="btn light"
onclick="go('explore')">
Explorar produtos
</button>

</div>


<div class="quick">

<button onclick="go('explore');filterCat('Eletrónicos')">
<i>▦</i>
Categorias
</button>

<button onclick="go('store')">
<i>🏪</i>
Lojas
</button>

<button onclick="go('favorites')">
<i>♥</i>
Favoritos
</button>

<button onclick="go('cart')">
<i>🛒</i>
Carrinho
</button>

<button onclick="go('seller')">
<i>▥</i>
Vendedor
</button>

</div>


<div class="head">

<h3>Em destaque</h3>

<button class="link" onclick="go('explore')">
Ver todos
</button>

</div>

<div id="homeProducts" class="grid"></div>

</section>


<!-- EXPLORE -->

<section id="explore" class="page">

<div class="head">

<h3>🔎 Explorar</h3>

<select
id="sort"
onchange="loadProducts()"
style="border:1px solid var(--line);border-radius:10px;padding:8px">

<option value="">Relevantes</option>
<option value="low">Menor preço</option>
<option value="high">Maior preço</option>

</select>

</div>


<div class="search">

<input
id="eq"
placeholder="Pesquisar produtos ou lojas"
oninput="loadProducts()">

</div>


<div id="cats" class="chiprow"></div>

<div
id="exploreProducts"
class="grid"
style="margin-top:12px">
</div>

</section>


<!-- PRODUCT -->

<section id="product" class="page">

<div id="productBox"></div>

</section>


<!-- STORE -->

<section id="store" class="page">

<div id="storeBox"></div>

</section>


<!-- FAVORITES -->

<section id="favorites" class="page">

<div class="head">

<h3>♥ Meus favoritos</h3>

</div>

<div id="favBox"></div>

</section>


<!-- CART -->

<section id="cart" class="page">

<div class="head">

<h3>🛒 Meu carrinho</h3>

</div>

<div id="cartBox"></div>

</section>


<!-- ACCOUNT -->

<section id="account" class="page">

<div id="accountBox"></div>

</section>


<!-- SELLER -->

<section id="seller" class="page">

<div id="sellerBox"></div>

</section>


<!-- ORDERS -->

<section id="orders" class="page">

<div class="head">

<h3>📦 Meus pedidos</h3>

</div>

<div id="ordersBox"></div>

</section>


<!-- CHATS -->

<section id="chats" class="page">

<div id="chatListBox"></div>

</section>


<!-- CHAT -->

<section id="chat" class="page">

<div id="chatBox"></div>

</section>

</main>


<nav class="bottom">

<button
class="nav active"
data-p="home"
onclick="go('home')">

<i>⌂</i>
Início

</button>


<button
class="nav"
data-p="explore"
onclick="go('explore')">

<i>▦</i>
Categorias

</button>


<button
class="nav"
data-p="favorites"
onclick="go('favorites')">

<i>♡</i>
Favoritos

</button>


<button
class="nav"
data-p="cart"
onclick="go('cart')">

<i>🛒</i>
Carrinho

</button>


<button
class="nav"
data-p="account"
onclick="go('account')">

<i>♙</i>
Perfil

</button>

</nav>

</div>


<div
id="modal"
class="modal">

<div class="sheet">

<button
class="close"
onclick="closeModal()">
✕
</button>

<div id="modalBody"></div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

let token =
localStorage.klToken || '';

let me = null;

let currentProduct = null;

let currentConversation = null;

let activeCat = 'Todos';

let photoData = [];

let dashboardPeriod = '30';


const $ =
id => document.getElementById(id);


const money =
n =>
new Intl.NumberFormat('pt-PT')
.format(Number(n)||0)+' Kz';


const esc =
v =>
String(v??'')
.replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));


async function api(p,o={}){

const h={
'Content-Type':'application/json'
};

if(token)
h.Authorization='Bearer '+token;

const r =
await fetch(
p,
{
...o,
headers:{
...h,
...(o.headers||{})
}
});

const t =
await r.text();

let d={};

try{
d=t?JSON.parse(t):{}
}
catch{
d={error:t}
}

if(!r.ok)
throw Error(d.error||'Erro');

return d;

}


function toast(t){

$('toast').textContent=t;

$('toast').classList.add('on');

setTimeout(
()=>$('toast').classList.remove('on'),
2400
);

}


function go(id){

document
.querySelectorAll('.page')
.forEach(
x =>
x.classList.toggle(
'on',
x.id===id
)
);

document
.querySelectorAll('.nav')
.forEach(
x =>
x.classList.toggle(
'active',
x.dataset.p===id
)
);

if(id==='home')
loadProducts();

if(id==='explore'){
renderCats();
loadProducts();
}

if(id==='favorites')
loadFavorites();

if(id==='cart')
loadCart();

if(id==='account')
loadAccount();

if(id==='seller')

/* =========================
   SALES CHART
========================= */

function renderSalesChart(history){

const chart=$('salesChart');

if(!chart)
return;

if(!history.length){

chart.innerHTML=
'<div class="empty" style="width:100%;padding:20px">Sem vendas para apresentar.</div>';

return;

}


/*
Agrupa as vendas por dia.
*/

const groups={};

history
.filter(
o =>
o.status!=='Cancelado'
)
.forEach(
o => {

const date =
o.createdAt
?
new Date(o.createdAt)
:
new Date();

const key =
date.toLocaleDateString(
'pt-PT',
{
day:'2-digit',
month:'2-digit'
}
);

groups[key]=
(groups[key]||0)+
Number(
o.amount||
o.total||
0
);

}
);


let entries =
Object.entries(groups)
.slice(-7);


if(!entries.length){

chart.innerHTML=
'<div class="empty" style="width:100%">Sem vendas válidas.</div>';

return;

}


const max =
Math.max(
...entries.map(x=>x[1]),
1
);


chart.innerHTML =
entries
.map(
([label,value])=>{

const height =
Math.max(
4,
(value/max)*125
);

return `

<div class="barWrap">

<div
class="bar"
style="height:${height}px"
title="${money(value)}">
</div>

<div class="barLabel">
${label}
</div>

</div>

`;

}
)
.join('');

}

/* =========================
   PHOTOS
========================= */

function handlePhotos(e){

const files =
[...e.target.files]
.slice(0,10);

photoData=[];

if(!files.length){

renderPhotoSlots();

return;

}

let done=0;

files.forEach(
f=>{

const r=
new FileReader();

r.onload=()=>{

const img=
new Image();

img.onload=()=>{

const c=
document.createElement(
'canvas'
);

const max=1000;

const scale =
Math.min(
1,
max/
Math.max(
img.width,
img.height
)
);

c.width =
Math.max(
1,
Math.round(
img.width*scale
)
);

c.height =
Math.max(
1,
Math.round(
img.height*scale
)
);

c
.getContext('2d')
.drawImage(
img,
0,
0,
c.width,
c.height
);

photoData.push(
c.toDataURL(
'image/jpeg',
.72
)
);

done++;

if(done===files.length){

photoData=
photoData.slice(0,10);

renderPhotoSlots();

}

};

img.src=r.result;

};

r.readAsDataURL(f);

}
);

}


function renderPhotoSlots(){

if(!$('photoGrid'))
return;

$('photoCount').textContent =
photoData.length+
'/5 fotos mínimas';

$('photoGrid').innerHTML =
Array.from(
{
length:
Math.max(
5,
photoData.length
)
},
(_,i)=>
`

<div class="slot">

${
photoData[i]
?
`<img src="${photoData[i]}">
<small>${i+1}</small>`
:
'<b>+</b>'
}

</div>

`
).join('');

}
