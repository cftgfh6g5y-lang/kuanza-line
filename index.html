<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#087443">
<title>Kuanza Line</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7f6;
  color:#17221d;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none !important;
}

.page{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:18px 16px 110px;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e4e9e6;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  color:#087443;
  font-size:20px;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#087443,#0ca75e);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:22px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:#f0f5f2;
  font-size:19px;
}

.card{
  background:#fff;
  border:1px solid #e3e9e5;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(0,0,0,.035);
}

.hero{
  background:linear-gradient(135deg,#087443,#0c9b56);
  color:#fff;
  border-radius:24px;
  padding:28px 22px;
  margin-bottom:18px;
}

.hero h1{
  font-size:30px;
  line-height:1.1;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
  line-height:1.5;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.section-title h2,
.section-title h3{
  margin:0;
}

.small{
  font-size:13px;
  color:#66736d;
  line-height:1.45;
}

.mt{
  margin-top:12px;
}

.mb{
  margin-bottom:12px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-weight:800;
}

.btn-primary{
  background:#087443;
  color:#fff;
}

.btn-secondary{
  background:#edf3ef;
  color:#087443;
}

.btn-danger{
  background:#b42318;
  color:#fff;
}

.btn-full{
  width:100%;
}

.form{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.form label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  border:1px solid #d5ded9;
  border-radius:12px;
  padding:12px 13px;
  background:#fff;
  outline:none;
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:#087443;
}

.form textarea{
  min-height:110px;
  resize:vertical;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick{
  border:1px solid #dfe8e3;
  background:#f8faf9;
  border-radius:14px;
  padding:14px;
  text-align:left;
  font-weight:800;
  color:#17221d;
}

.quick small{
  display:block;
  margin-top:5px;
  font-weight:500;
  color:#6a756f;
}

.emoji{
  font-size:24px;
  margin-bottom:6px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.product-card{
  background:#fff;
  border:1px solid #e2e8e4;
  border-radius:16px;
  overflow:hidden;
  position:relative;
}

.product-image{
  aspect-ratio:1/1;
  background:#eef3f0;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-body{
  padding:12px;
}

.price{
  color:#087443;
  font-size:17px;
  font-weight:900;
}

.product-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.product-actions button{
  flex:1;
}

.favorite-btn{
  position:absolute;
  top:9px;
  right:9px;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  font-size:20px;
  z-index:2;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:6px 9px;
  border-radius:999px;
  background:#edf6f0;
  color:#087443;
  font-size:12px;
  font-weight:800;
}

.status{
  padding:6px 9px;
  background:#edf3ef;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.empty{
  padding:30px 12px;
  text-align:center;
  color:#69756f;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}

.stat{
  background:#f6f9f7;
  border-radius:13px;
  padding:13px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:19px;
  color:#087443;
}

.stat small{
  color:#6a756f;
  font-size:11px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:18px;
  background:#087443;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}

.profile-info{
  min-width:0;
}

.profile-info h2{
  font-size:20px;
  overflow-wrap:anywhere;
}

.profile-info p{
  color:#66736d;
  font-size:13px;
  overflow-wrap:anywhere;
}

.score-box{
  margin-top:18px;
  background:linear-gradient(135deg,#073e27,#087443);
  color:#fff;
  border-radius:18px;
  padding:18px;
}

.score-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.score-number{
  font-size:42px;
  font-weight:900;
  line-height:1;
  margin-top:5px;
}

.score-label{
  font-weight:900;
  text-align:right;
}

.score-bar{
  height:8px;
  background:rgba(255,255,255,.2);
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 10px;
}

.score-fill{
  height:100%;
  background:#ffd34e;
  border-radius:99px;
}

.seller-progress{
  background:#f5faf7;
  border:1px solid #dcebe2;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
}

.progress-line{
  height:8px;
  background:#dfe8e3;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0 7px;
}

.progress-fill{
  height:100%;
  background:#087443;
  border-radius:99px;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:10px;
}

.photo-slot{
  aspect-ratio:1;
  background:#eef3f0;
  border-radius:9px;
  overflow:hidden;
}

.photo-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.order{
  border:1px solid #e1e8e4;
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-items{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.conversation{
  background:#fff;
  border:1px solid #e0e7e3;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
  cursor:pointer;
}

.notification{
  padding:14px;
  border:1px solid #e1e8e4;
  border-radius:14px;
  margin-bottom:10px;
  background:#fbfcfb;
}

.chat{
  height:340px;
  overflow-y:auto;
  padding:12px 4px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:82%;
  padding:10px 12px;
  border-radius:14px;
  font-size:14px;
  line-height:1.4;
}

.message.mine{
  align-self:flex-end;
  background:#087443;
  color:#fff;
  border-bottom-right-radius:4px;
}

.message.theirs{
  align-self:flex-start;
  background:#edf2ef;
  color:#17221d;
  border-bottom-left-radius:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.chat-input input{
  flex:1;
  min-width:0;
  border:1px solid #d5ded9;
  border-radius:12px;
  padding:11px;
}

.chat-input button{
  border:none;
  background:#087443;
  color:#fff;
  border-radius:12px;
  padding:0 14px;
  font-weight:800;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  background:#fff;
  border-top:1px solid #e1e7e3;
  display:flex;
  justify-content:center;
  padding:8px max(8px,env(safe-area-inset-left))
           calc(8px + env(safe-area-inset-bottom))
           max(8px,env(safe-area-inset-right));
}

.nav-btn{
  flex:1;
  max-width:180px;
  border:none;
  background:transparent;
  color:#718078;
  padding:6px 3px;
  font-size:11px;
  font-weight:700;
}

.nav-btn.active{
  color:#087443;
}

.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  z-index:100;
  background:#17221d;
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  font-size:13px;
  max-width:90%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
}

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:22px;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:none;
  border-radius:10px;
  background:#edf2ef;
  font-size:18px;
}

.center{
  text-align:center;
}

@media(max-width:520px){

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .photo-grid{
    grid-template-columns:repeat(5,1fr);
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">

      <div class="logo-mark">
        K
      </div>

      <span>
        KUANZA LINE
      </span>

    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        onclick="showNotifications()">
        🔔
      </button>

      <button
        class="icon-btn"
        onclick="go('account')">
        👤
      </button>

    </div>

  </div>

</header>

<main id="appContent"></main>

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    id="nav-home"
    onclick="go('home')">

    <span class="nav-icon">
      ⌂
    </span>

    <span>
      Início
    </span>

  </button>

  <button
    class="nav-btn"
    id="nav-explore"
    onclick="go('explore')">

    <span class="nav-icon">
      🔎
    </span>

    <span>
      Explorar
    </span>

  </button>

  <button
    class="nav-btn"
    id="nav-sell"
    onclick="go('sell')">

    <span class="nav-icon">
      ＋
    </span>

    <span>
      Vender
    </span>

  </button>

  <button
    class="nav-btn"
    id="nav-orders"
    onclick="go('orders')">

    <span class="nav-icon">
      📦
    </span>

    <span>
      Pedidos
    </span>

  </button>

  <button
    class="nav-btn"
    id="nav-account"
    onclick="go('account')">

    <span class="nav-icon">
      👤
    </span>

    <span>
      Conta
    </span>

  </button>

</nav>

<div
  id="toast"
  class="toast">
</div>

<!-- MODAL PRINCIPAL: NÃO REMOVER -->
<div
  id="modal"
  class="modal hidden"
  onclick="modalBackground(event)">

  <div
    class="modal-box"
    id="modalBox">
  </div>

</div>

<script>

const API = location.origin;

let token =
  localStorage.getItem('kuanza_token') ||
  localStorage.getItem('klToken') ||
  '';

let me = null;

let products = [];

let cart = [];

let favorites = [];

let currentProduct = null;

let currentConversation = null;

let selectedPhotos = [];

const categories = [
  'Todos',
  'Eletrónica',
  'Telemóveis',
  'Informática',
  'Moda',
  'Casa',
  'Beleza',
  'Automóveis',
  'Serviços',
  'Outros'
];

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

function money(value){

  const number =
    Number(value || 0);

  return number.toLocaleString(
    'pt-AO'
  ) + ' Kz';

}

function toast(message){

  const box =
    document.getElementById('toast');

  if(!box) return;

  box.textContent =
    String(message || '');

  box.classList.add('show');

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(()=>{
      box.classList.remove('show');
    },2800);

}

async function api(
  path,
  options={}
){

  const headers = {
    'Content-Type':'application/json',
    ...(options.headers || {})
  };

  if(token){

    headers.Authorization =
      'Bearer ' + token;

  }

  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );

  let data = null;

  try{
    data = await response.json();
  }catch(e){
    data = null;
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `Erro ${response.status}`
    );

  }

  return data;

}

function saveCart(){

  localStorage.setItem(
    'kuanza_cart',
    JSON.stringify(cart)
  );

}

function saveFavorites(){

  localStorage.setItem(
    'kuanza_favorites',
    JSON.stringify(favorites)
  );

}

function setActiveNav(id){

  document
    .querySelectorAll('.nav-btn')
    .forEach(btn=>{
      btn.classList.remove('active');
    });

  const element =
    document.getElementById(
      'nav-' + id
    );

  if(element){
    element.classList.add('active');
  }

}

async function go(id){

  setActiveNav(id);

  if(id === 'home'){
    await loadHome();
    return;
  }

  if(id === 'explore'){
    await loadExplore();
    return;
  }

  if(id === 'sell'){
    await loadSell();
    return;
  }

  if(id === 'orders'){
    await loadOrders();
    return;
  }

  if(id === 'account'){
    await loadAccount();
    return;
  }

  if(id === 'store'){
    await loadStore();
    return;
  }

  if(id === 'favorites'){
    await loadFavorites();
    return;
  }

  if(id === 'cart'){
    await loadCart();
    return;
  }

  if(id === 'dashboard'){
    await loadDashboard();
    return;
  }

  if(id === 'conversations'){
    await loadConversations();
    return;
  }

}

async function loadHome(){

  const root =
    document.getElementById(
      'appContent'
    );

  if(!root) return;

  root.innerHTML = `

    <div class="page">

      <section class="hero">

        <h1>
          Compra. Vende. Confia.
        </h1>

        <p>
          O marketplace criado para comprar e vender
          com mais segurança em Angola.
        </p>

      </section>

      <div class="card">

        <div class="section-title">

          <h3>
            Categorias
          </h3>

          <button
            class="btn btn-secondary"
            onclick="go('explore')">
            Ver todas
          </button>

        </div>

        <div class="quick-grid">

          ${categories
            .filter(c=>c!=='Todos')
            .slice(0,8)
            .map(c=>`

              <button
                class="quick"
                onclick="openCategory('${esc(c)}')">

                <span class="emoji">
                  ${categoryIcon(c)}
                </span>

                ${esc(c)}

              </button>

            `)
            .join('')}

        </div>

      </div>

      <div class="card">

        <div class="section-title">

          <h3>
            Produtos em destaque
          </h3>

          <button
            class="btn btn-secondary"
            onclick="go('explore')">
            Explorar
          </button>

        </div>

        <div id="homeProducts">

          <div class="empty">
            A carregar produtos...
          </div>

        </div>

      </div>

      <div class="card">

        <div class="section-title">

          <h3>
            Kuanza Line
          </h3>

        </div>

        <p class="small">
          Compra com confiança, conhece a reputação
          dos vendedores e mantém as tuas transações
          dentro de uma plataforma preparada para reduzir fraudes.
        </p>

      </div>

    </div>

  `;

  try{

    const data =
      await api('/api/products');

    products =
      Array.isArray(data)
        ? data
        : (
            data.products ||
            data.items ||
            data.data ||
            []
          );

    renderProducts(
      products.slice(0,6),
      'homeProducts'
    );

  }catch(e){

    const box =
      document.getElementById(
        'homeProducts'
      );

    if(box){

      box.innerHTML = `
        <div class="empty">
          Não foi possível carregar os produtos.
        </div>
      `;

    }

  }

}

function categoryIcon(category){

  const icons = {

    'Eletrónica':'📱',
    'Telemóveis':'📱',
    'Informática':'💻',
    'Moda':'👕',
    'Casa':'🏠',
    'Beleza':'💄',
    'Automóveis':'🚗',
    'Serviços':'🛠️',
    'Outros':'📦'

  };

  return icons[category] || '📦';

}

function openCategory(category){

  activeCategory =
    category;

  go('explore');

}

let activeCategory = 'Todos';

async function loadExplore(){

  const root =
    document.getElementById(
      'appContent'
    );

  if(!root) return;

  root.innerHTML = `

    <div class="page">

      <div class="card">

        <h2>
          🔎 Explorar
        </h2>

        <div class="form mt">

          <div>

            <label>
              Procurar
            </label>

            <input
              id="searchInput"
              placeholder="O que estás à procura?"
              oninput="filterExplore()">

          </div>

          <div>

            <label>
              Categoria
            </label>

            <select
              id="exploreCategory"
              onchange="filterExplore()">

              ${categories.map(c=>`

                <option
                  value="${esc(c)}"
                  ${c===activeCategory?'selected':''}>

                  ${esc(c)}

                </option>

              `).join('')}

            </select>

          </div>

          <div>

            <label>
              Ordenar
            </label>

            <select
              id="sortProducts"
              onchange="filterExplore()">

              <option value="new">
                Mais recentes
              </option>

              <option value="low">
                Menor preço
              </option>

              <option value="high">
                Maior preço
              </option>

            </select>

          </div>

        </div>

      </div>

      <div
        id="exploreProducts">

        <div class="empty">
          A carregar...
        </div>

      </div>

    </div>

  `;

  try{

    const data =
      await api('/api/products');

    products =
      Array.isArray(data)
        ? data
        : (
            data.products ||
            data.items ||
            data.data ||
            []
          );

    filterExplore();

  }catch(e){

    document.getElementById(
      'exploreProducts'
    ).innerHTML = `
      <div class="card">
        <div class="empty">

function filterExplore(){

  const search =
    (
      document.getElementById(
        'searchInput'
      )?.value || ''
    ).toLowerCase().trim();

  const category =
    document.getElementById(
      'exploreCategory'
    )?.value || 'Todos';

  const sort =
    document.getElementById(
      'sortProducts'
    )?.value || 'new';

  let list =
    Array.isArray(products)
      ? [...products]
      : [];

  if(search){

    list =
      list.filter(p=>
        String(p.name || '')
          .toLowerCase()
          .includes(search) ||

        String(p.description || '')
          .toLowerCase()
          .includes(search)
      );

  }

  if(category !== 'Todos'){

    list =
      list.filter(p=>
        String(p.category || '') ===
        String(category)
      );

  }

  if(sort === 'low'){

    list.sort(
      (a,b)=>
        Number(a.price || 0) -
        Number(b.price || 0)
    );

  }

  if(sort === 'high'){

    list.sort(
      (a,b)=>
        Number(b.price || 0) -
        Number(a.price || 0)
    );

  }

  renderProducts(
    list,
    'exploreProducts'
  );

}

async function toggleProductFavorite(id){

  if(!token){

    toast('Inicia sessão para guardar favoritos.');

    closeModal();

    go('account');

    return;

  }

  try{

    const response =
      await api('/api/favorites');

    const list =
      Array.isArray(response)
        ? response
        : (
            response.favorites ||
            response.items ||
            response.products ||
            response.data ||
            []
          );

    const exists =
      list.some(item=>
        String(
          item.id ||
          item.productId
        ) === String(id)
      );

    if(exists){

      await api(
        '/api/favorites/' +
        encodeURIComponent(id),
        {
          method:'DELETE'
        }
      );

      favorites =
        favorites.filter(
          x =>
            String(x) !==
            String(id)
        );

      toast('Removido dos favoritos.');

    }else{

      await api(
        '/api/favorites/' +
        encodeURIComponent(id),
        {
          method:'POST'
        }
      );

      if(
        !favorites.some(
          x =>
            String(x) ===
            String(id)
        )
      ){

        favorites.push(id);

      }

      toast('Adicionado aos favoritos ♥');

    }

    saveFavorites();

    if(currentProduct){

      await openProduct(
        currentProduct.id
      );

    }

  }catch(e){

    toast(
      e.message ||
      'Não foi possível atualizar favoritos.'
    );

  }

}

async function handlePhotos(event){

  const files =
    Array.from(
      event.target.files || []
    );

  if(!files.length){
    return;
  }

  if(files.length < 5){

    toast(
      'Seleciona pelo menos 5 fotografias.'
    );

    event.target.value = '';

    selectedPhotos = [];

    renderPhotoPreview();

    return;

  }

  if(files.length > 10){

    toast(
      'Seleciona no máximo 10 fotografias.'
    );

    event.target.value = '';

    selectedPhotos = [];

    renderPhotoPreview();

    return;

  }

  try{

    selectedPhotos = [];

    for(const file of files){

      if(!file.type.startsWith('image/')){
        continue;
      }

      const data =
        await fileToDataURL(file);

      selectedPhotos.push(data);

    }

    if(selectedPhotos.length < 5){

      toast(
        'Precisamos de pelo menos 5 fotografias válidas.'
      );

      selectedPhotos = [];

      event.target.value = '';

    }

    renderPhotoPreview();

  }catch(e){

    selectedPhotos = [];

    event.target.value = '';

    toast(
      'Não foi possível carregar as fotografias.'
    );

  }

}

function fileToDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(reader.result);

      reader.onerror =
        ()=>reject(
          new Error(
            'Falha ao ler imagem.'
          )
        );

      reader.readAsDataURL(file);

    }
  );

}

function renderPhotoPreview(){

  const box =
    document.getElementById(
      'photoPreview'
    );

  if(!box) return;

  if(!selectedPhotos.length){

    box.innerHTML = `
      <div class="empty">
        Nenhuma fotografia selecionada.
      </div>
    `;

    return;

  }

  box.innerHTML =
    selectedPhotos.map(
      (src,i)=>`

        <div class="photo-slot">

          <img
            src="${esc(src)}"
            alt="Foto ${i+1}">

        </div>

      `
    ).join('');

}

async function publishProduct(){

  if(!token){

    toast(
      'Inicia sessão primeiro.'
    );

    go('account');

    return;

  }

  if(!me){

    try{

      const data =
        await api('/api/me');

      me =
        data.user ||
        data;

    }catch(e){

      toast(
        'A tua sessão expirou.'
      );

      logout();

      return;

    }

  }

  if(me.role !== 'seller'){

    toast(
      'Muda para conta de vendedor primeiro.'
    );

    return;

  }

  const name =
    document
      .getElementById('productName')
      ?.value
      .trim() || '';

  const category =
    document
      .getElementById('productCategory')
      ?.value || 'Outros';

  const price =
    Number(
      document
        .getElementById('productPrice')
        ?.value || 0
    );

  const stock =
    Number(
      document
        .getElementById('productStock')
        ?.value || 0
    );

  const description =
    document
      .getElementById('productDescription')
      ?.value
      .trim() || '';

  if(!name){

    toast(
      'Digite o nome do produto.'
    );

    return;

  }

  if(!price || price <= 0){

    toast(
      'Digite um preço válido.'
    );

    return;

  }

  if(!stock || stock <= 0){

    toast(
      'Digite um stock válido.'
    );

    return;

  }

  if(description.length < 15){

    toast(
      'A descrição deve ter pelo menos 15 caracteres.'
    );

    return;

  }

  if(selectedPhotos.length < 5){

    toast(
      'Adiciona pelo menos 5 fotografias.'
    );

    return;

  }

  if(selectedPhotos.length > 10){

    toast(
      'Podes adicionar no máximo 10 fotografias.'
    );

    return;

  }

  try{

    await api('/api/products',{
      method:'POST',
      body:JSON.stringify({

        name,
        category,
        price,
        stock,
        description,
        images:selectedPhotos

      })
    });

    selectedPhotos = [];

    toast(
      'Produto publicado com sucesso ✓'
    );

    await loadStore();

  }catch(e){

    toast(
      e.message ||
      'Não foi possível publicar o produto.'
    );

  }

}

async function submitReview(productId){

  const rating =
    Number(
      document
        .getElementById('reviewRating')
        ?.value || 0
    );

  const comment =
    document
      .getElementById('reviewComment')
      ?.value
      .trim() || '';

  if(!rating){

    toast(
      'Seleciona uma classificação.'
    );

    return;

  }

  try{

    await api('/api/reviews',{
      method:'POST',
      body:JSON.stringify({
        productId,
        rating,
        comment
      })
    });

    closeModal();

    toast(
      'Avaliação enviada com sucesso ✓'
    );

    await openProduct(productId);

  }catch(e){

    toast(
      e.message ||
      'Não foi possível enviar a avaliação.'
    );

  }

}
