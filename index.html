<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#087443">
<meta name="description" content="Kuanza Line — Compra. Vende. Confia.">
<title>Kuanza Line</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7f6;
  color:#17221d;
  padding-bottom:82px;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:#f5f7f6;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#087443;
  color:white;
  padding:14px 16px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.topbar-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#fff;
  color:#087443;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Poppins,sans-serif;
  font-weight:800;
  font-size:22px;
}

.logo-text{
  font-family:Poppins,sans-serif;
  font-size:18px;
  font-weight:800;

}

.logo-sub{
  font-size:10px;
  opacity:.82;
  margin-top:3px;
}

.top-actions{
  display:flex;

}

.icon-btn{

  height:38px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.13);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;

}

.page{

}

.hero{

.search-box{

.quick-grid{

.btn{

.btn-primary{

.btn-secondary{

.form label{

.form input,

.form textarea{

.profile-info h2{

.profile-info p{

.score-number{

.stats{

.stat{

.stat strong{

.photo-slot{

.gallery{

.gallery img{

.status{

.cart-item{

}

.cart-info{

.quantity{

.quantity button{

}

.total-box{

.total-line{

.filters{

.conversation{

.chat{

.message.mine{

.message.theirs{

.chat-input{

.chat-input input{

.chat-input button{

.dashboard-grid{

.metric{

.metric small{

.metric strong{

.top-product{

.top-product:last-child{

.top-product strong{

.top-product small{

.nav-btn{

.nav-btn .nav-icon{

.center{

.mb{

</head>

<body>

<div class="app">

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-mark">K</div>
      <div>
        <div class="logo-text">KUANZA LINE</div>
        <div class="logo-sub">Compra. Vende. Confia.</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" onclick="showNotifications()">🔔</button>
      <button class="icon-btn" onclick="go('account')">👤</button>
    </div>
  </div>
</header>

<main id="appContent"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="go('home')">
    <span class="nav-icon">⌂</span>
    <span>Início</span>
  </button>

  <button class="nav-btn" id="nav-explore" onclick="go('explore')">
    <span class="nav-icon">🔎</span>
    <span>Explorar</span>
  </button>

  <button class="nav-btn" id="nav-sell" onclick="go('sell')">
    <span class="nav-icon">＋</span>
    <span>Vender</span>
  </button>

  <button class="nav-btn" id="nav-orders" onclick="go('orders')">
    <span class="nav-icon">📦</span>
    <span>Pedidos</span>
  </button>

  <button class="nav-btn" id="nav-account" onclick="go('account')">
    <span class="nav-icon">👤</span>
    <span>Conta</span>
  </button>
</nav>

</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal hidden" onclick="modalBackground(event)">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const API = location.origin;

let token = localStorage.getItem('kuanza_token') || '';
let me = null;
let products = [];
let cart = JSON.parse(localStorage.getItem('kuanza_cart') || '[]');
let favorites = JSON.parse(localStorage.getItem('kuanza_favorites') || '[]');
let currentProduct = null;
let currentConversation = null;
let selectedPhotos = [];

const categories = [
  'Todos',
  'Telemóveis',
  'Eletrónicos',
  'Moda',
  'Casa',
  'Beleza',
  'Calçados',
  'Acessórios',
  'Automóveis',
  'Outros'
];

function money(value){
  return Number(value || 0).toLocaleString('pt-AO') + ' Kz';
}

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function toast(message){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('on');

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.remove('on');
  },2600);
}

async function api(path, options={}){
  const headers = {
    'Content-Type':'application/json',
    ...(options.headers || {})
  };

  if(token){
    headers.Authorization = 'Bearer ' + token;
  }

  const response = await fetch(API + path,{
    ...options,
    headers
  });

  const text = await response.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }catch{
    data = {message:text};
  }

  if(!response.ok){
    throw new Error(data.message || data.error || 'Ocorreu um erro.');
  }

  return data;
}

function saveCart(){
  localStorage.setItem('kuanza_cart',JSON.stringify(cart));
}

function saveFavorites(){

function productCard(p){

  const image =
    (Array.isArray(p.photos) && p.photos.length > 0
      ? p.photos[0]
      : null) ||
    (Array.isArray(p.images) && p.images.length > 0
      ? p.images[0]
      : null) ||
    p.image ||
    'https://placehold.co/600x600?text=Kuanza+Line';

  const favorite = favorites.includes(p.id);

  return `
    <article class="product-card">

      <button
        class="card-heart"
        onclick="event.stopPropagation();toggleFavorite('${esc(p.id)}')">

      <img
        class="product-image"

        alt="${esc(p.name || 'Produto')}"

        onclick="openProduct('${esc(p.id)}')"

function runExploreSearch(){
  const search =
    (document.getElementById('exploreSearch')?.value || '')
      .toLowerCase()
      .trim();

  const category =
    document.getElementById('exploreCategory')?.value || 'Todos';

  const sort =
    document.getElementById('exploreSort')?.value || 'recent';

  let list = [...products];

  if(search){
    list = list.filter(p =>
      String(p.name || '').toLowerCase().includes(search) ||
      String(p.description || '').toLowerCase().includes(search)
    );
  }

  if(category !== 'Todos'){
    list = list.filter(p =>
      String(p.category || '').toLowerCase() === category.toLowerCase()
    );
  }

  if(sort === 'low'){
    list.sort((a,b)=>Number(a.price||0)-Number(b.price||0));
  }

  if(sort === 'high'){
    list.sort((a,b)=>Number(b.price||0)-Number(a.price||0));
  }

  renderProducts(list,'exploreProducts');
}

function addToCart(id){
  const product = products.find(p=>String(p.id)===String(id));

  if(!product){
    toast('Produto não encontrado.');
    return;
  }

  const existing = cart.find(item=>String(item.id)===String(id));

  if(existing){
    existing.quantity += 1;
  }else{
    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price||0),
      image:product.images?.[0] || product.image || '',
      sellerId:product.sellerId || product.seller?.id || null,
      quantity:1
    });
  }

  saveCart();
  toast('Produto adicionado ao carrinho 🛒');
}

function changeQuantity(id,delta){
  const item = cart.find(x=>String(x.id)===String(id));

  if(!item) return;

  item.quantity += delta;

  if(item.quantity <= 0){
    cart = cart.filter(x=>String(x.id)!==String(id));
  }

  saveCart();
  loadCart();
}

function cartTotal(){
  return cart.reduce((sum,item)=>
    sum + Number(item.price||0) * Number(item.quantity||1),0
  );
}

  cart = cart.filter(x=>String(x.id)!==String(id));

async function checkout(){
  if(!token){
    toast('Inicia sessão para finalizar a compra.');
    go('account');
    return;
  }

  if(!cart.length){
    toast('O carrinho está vazio.');
    return;
  }

  const items = cart.map(item=>({
    productId:item.id,
    quantity:item.quantity
  }));

  try{
    const result = await api('/api/orders',{
      method:'POST',
      body:JSON.stringify({
        items
      })
    });

    cart = [];
    saveCart();

    toast('Pedido criado com sucesso ✓');

    setTimeout(()=>{
      go('orders');
    },700);

  }catch(e){
    toast(e.message);
  }
}

async function loadReviews(productId,sellerId){
  const box=document.getElementById('reviewsBox'); const summary=document.getElementById('reviewSummary');
  if(!box)return;
  try{
    const qs=productId?'?productId='+encodeURIComponent(productId):'?sellerId='+encodeURIComponent(sellerId);
    const list=await api('/api/reviews'+qs);
    const arr=Array.isArray(list)?list:[];
    const avg=arr.length?(arr.reduce((a,r)=>a+Number(r.rating||0),0)/arr.length).toFixed(1):'0.0';
    if(summary)summary.textContent=arr.length?`⭐ ${avg}/5 · ${arr.length} avaliação${arr.length===1?'':'ões'}`:'Ainda sem avaliações';

async function switchRole(){

  if(!token){
    toast('Inicia sessão primeiro.');
    go('account');
    return;
  }

  try{

    const newRole =
      me && me.role === 'seller'
        ? 'buyer'
        : 'seller';

    toast('A alterar tipo de conta...');

    const response = await api('/api/me/role',{
      method:'PATCH',
      body:JSON.stringify({
        role:newRole
      })
    });

    /*
      O servidor pode devolver:
      { user: {...} }
      ou diretamente:
      {...}
    */
    const returnedUser =
      response.user ||
      response;

    me = returnedUser;

    /*
      Confirma diretamente no servidor.
      Isto evita que a interface fique presa
      no tipo de conta antigo.
    */
    const fresh = await api('/api/me');

    me = fresh.user || fresh;

    if(me.role !== newRole){
      throw new Error(
        'O servidor não confirmou a mudança de conta.'
      );
    }

    toast(
      newRole === 'seller'
        ? '🏪 Agora estás como vendedor ✓'
        : '🛒 Agora estás como comprador ✓'
    );

    await loadAccount();

  }catch(e){

    console.error('Erro ao mudar conta:',e);

    toast(
      e.message ||
      'Não foi possível mudar o tipo de conta.'
    );
  }
}

async function handlePhotos(event){

  const files =
    Array.from(event.target.files || []);

  if(!files.length){
    return;
  }

  if(files.length > 10){
    toast('Podes selecionar no máximo 10 fotos.');
    event.target.value = '';
    return;
  }

  try{

    selectedPhotos = [];

    for(const file of files){

      const dataUrl =
        await compressImage(file);

      selectedPhotos.push(dataUrl);
    }

    renderPhotoPreview();

  }catch(e){
    toast('Não foi possível processar as fotos.');
  }
}

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = event=>{

      const img = new Image();

      img.onload = ()=>{

        const max = 1000;

        let width = img.width;
        let height = img.height;

        if(width > max || height > max){

          if(width > height){

            height =
              Math.round(height * max / width);

            width = max;

          }else{

            width =
              Math.round(width * max / height);

            height = max;

          }
        }

        const canvas =
          document.createElement('canvas');

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            'image/jpeg',
            .72
          )
        );

      };

      img.onerror = reject;

      img.src = event.target.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

        ${esc(e.message)}
      </div>
    `;
  }
}

async function loadSellerOrders(){
  if(!token){
    toast('Inicia sessão primeiro.');
    return;
  }
  try{
    const data = await api('/api/seller/orders');
    const orders = Array.isArray(data) ? data : (data.orders || []);
    let html = '';
    if(!orders.length){
      html = '<div class="empty">Nenhuma venda encontrada.</div>';
    }else{
      html = orders.map(order=>{
        const items = (order.items || []).map(item =>
          esc(item.productName || item.name || 'Produto') + ' × ' + (item.quantity || 1)
        ).join('<br>');
        const statuses = ['Pendente','Confirmado','Em preparação','Enviado','Entregue','Cancelado'];
        const options = statuses.map(status =>
          '<option value="' + esc(status) + '" ' + (order.status===status ? 'selected' : '') + '>' + esc(status) + '</option>'
        ).join('');
        return '<div class="order">'
          + '<div class="order-head"><strong>#' + esc(String(order.id).slice(-8)) + '</strong>'
          + '<span class="status">' + esc(order.status || 'Pendente') + '</span></div>'
          + '<div class="order-items">' + items + '</div>'
          + '<div class="row mt"><strong>' + money(order.total || 0) + '</strong>'
          + '<select onchange="updateSellerOrderStatus(\'' + esc(order.id) + '\',this.value)">' + options + '</select></div>'
          + '</div>';
      }).join('');
    }
    openModal('<div class="modal-head"><h3>📦 Vendas recebidas</h3><button class="close" onclick="closeModal()">✕</button></div>' + html);
  }catch(e){
    toast(e.message);
  }
}

async function updateSellerOrderStatus(id,status){

  try{

    await api('/api/seller/orders/' + encodeURIComponent(id),{
      method:'PATCH',
      body:JSON.stringify({
        status
      })
    });

    toast('Estado do pedido atualizado ✓');

  }catch(e){
    toast(e.message);
  }
}

async function loadConversations(){

  const root =
    document.getElementById('appContent');

  if(!token){
    root.innerHTML = `
      <div class="page">
        <div class="empty">
          Inicia sessão para ver as conversas.
        </div>
      </div>
    `;
    return;
  }

  root.innerHTML = `
    <div class="page">

      <div class="section-title">
        <h2>💬 Minhas conversas</h2>
      </div>

      <div id="conversationsList">
        <div class="empty">A carregar...</div>
      </div>

    </div>
  `;

  try{

    const data =
      await api('/api/conversations');

    const conversations =
      Array.isArray(data)
        ? data
        : (data.conversations || []);

    const target =
      document.getElementById('conversationsList');

    if(!conversations.length){
      target.innerHTML = `
        <div class="empty">

          <div class="emoji">💬</div>

          <strong>Nenhuma conversa ainda.</strong>

          <p class="small mt">
            Abre um produto e fala com o vendedor.
          </p>

        </div>
      `;
      return;
    }

    target.innerHTML =
      conversations.map(c=>`

        <div class="conversation"
          onclick="openConversation('${esc(c.id)}')">

          <div class="row">

            <strong>
              ${esc(c.productName || 'Conversa')}
            </strong>

            <span class="small">
              ${c.updatedAt ? new Date(c.updatedAt).toLocaleDateString('pt-AO') : ''}
            </span>

          </div>

          <div class="small mt">
            ${esc(c.lastMessage || 'Abrir conversa')}
          </div>

        </div>

      `).join('');

  }catch(e){

    document.getElementById('conversationsList').innerHTML =
      `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function startChatWithSeller(sellerId){

  if(!token){
    toast('Inicia sessão para conversar.');
    go('account');
    return;
  }

  if(!currentProduct){
    return;
  }

  if(!sellerId){
    toast('Este vendedor não está disponível para chat.');
    return;
  }

  if(String(sellerId) === String(me?.id)){
    toast('Não podes iniciar uma conversa contigo mesmo.');
    return;
  }

  try{

    const data =
      await api('/api/conversations',{
        method:'POST',
        body:JSON.stringify({
          sellerId,
          productId:currentProduct.id
        })
      });

    const conversation =
      data.conversation || data;

    currentConversation =
      conversation.id || conversation._id;

    await openConversation(currentConversation);

  }catch(e){
    toast(e.message);
  }
}

async function openConversation(id){

  if(!token){
    toast('Inicia sessão.');
    return;
  }

  try{

    const data =
      await api('/api/conversations/' + encodeURIComponent(id));

    const conversation =
      data.conversation || data;

    currentConversation =
      conversation.id || id;

    const messages =
      conversation.messages || [];

    openModal(`
      <div class="modal-head">

        <h3>
          💬 ${esc(conversation.productName || 'Conversa')}
        </h3>

        <button class="close"
          onclick="closeModal()">
          ✕
        </button>

      </div>

      <div class="chat" id="chatMessages">

        ${
          messages.length
          ? messages.map(renderMessage).join('')
          : `
            <div class="center small">
              Nenhuma mensagem ainda.
            </div>
          `
        }

      </div>

      <div class="chat-input">

        <input
          id="chatInput"
          placeholder="Escreve uma mensagem..."
          onkeydown="if(event.key==='Enter')sendChatMessage()">

        <button onclick="sendChatMessage()">
          Enviar
        </button>

      </div>

      <button class="btn btn-secondary btn-full mt"
        onclick="sendOffer()">
        💰 Fazer proposta
      </button>

    `);

    setTimeout(()=>{
      const chat =
        document.getElementById('chatMessages');

      if(chat){
        chat.scrollTop = chat.scrollHeight;
      }
    },50);

  }catch(e){
    toast(e.message);
  }
}

function renderMessage(message){

  const mine =
    String(message.senderId || message.userId) === String(me?.id);

  return `
    <div class="message ${mine?'mine':'theirs'}">

      ${esc(message.text || '')}

      ${
        message.amount
        ? `
          <div class="mt">
            <strong>
              Proposta: ${money(message.amount)}
            </strong>
          </div>
        `
        : ''
      }

    </div>
  `;
}

async function sendChatMessage(){

  const input =
    document.getElementById('chatInput');

  const text =
    input?.value.trim();

  if(!text || !currentConversation){
    return;
  }

  try{

    await api('/api/conversations/' +
      encodeURIComponent(currentConversation),{
        method:'POST',
        body:JSON.stringify({
          text,
          type:'text'
        })
      });

    input.value = '';

    await openConversation(currentConversation);

  }catch(e){
    toast(e.message);
  }
}

async function sendOffer(){

  if(!currentConversation){
    return;
  }

  const amount =
    prompt('Qual é o valor da tua proposta em Kz?');

  if(!amount){
    return;
  }

  const value =
    Number(String(amount).replace(/\D/g,''));

  if(!value || value <= 0){
    toast('Valor inválido.');
    return;
  }

  try{

    await api('/api/conversations/' +
      encodeURIComponent(currentConversation),{
        method:'POST',
        body:JSON.stringify({
          text:'Nova proposta de preço',
          type:'offer',
          amount:value
        })
      });

    await openConversation(currentConversation);

  }catch(e){
    toast(e.message);
  }
}

  openModal(`
    <div class="modal-head">

      <h3>🔔 Notificações</h3>

      <button class="close"
        onclick="closeModal()">
        ✕
      </button>

    <div class="notification">

      <strong>Bem-vindo ao Kuanza Line!</strong>

      <div class="small mt">
        Aqui receberás atualizações sobre pedidos,
        mensagens, vendas e segurança da tua conta.
      </div>

    </div>

    <div class="notification">

      <strong>🛡️ Kuanza Score</strong>

      <div class="small mt">
        Mantém boas avaliações, entrega os pedidos
        e evita cancelamentos para aumentar a tua confiança.
      </div>

    </div>

  `);

}

function openModal(content){

  const modal =
    document.getElementById('modal');

  const box =
    document.getElementById('modalBox');

  box.innerHTML = content;

  modal.classList.remove('hidden');
}

function closeModal(){

  document
    .getElementById('modal')
    .classList.add('hidden');
}

function modalBackground(event){

  if(event.target.id === 'modal'){
    closeModal();
  }
}

async function init(){

  if(token){

    try{

      const data =
        await api('/api/me');

      me =
        data.user ||
        data;

    }catch(e){

      console.log('Sessão não encontrada.');

      token = '';

      localStorage.removeItem('kuanza_token');

      me = null;
    }
  }

  await loadHome();
}

init();
</script>
