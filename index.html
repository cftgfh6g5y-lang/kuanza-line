<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075B35">

<title>Kuanza Line — Compra. Vende. Confia.</title>

<style>

:root{
  --g:#12a34a;
  --gd:#075b35;
  --dark:#061a12;
  --ink:#102018;
  --muted:#718078;
  --line:#dfe9e3;
  --soft:#f1f7f3;
  --y:#f4c400;
  --red:#e94b35;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#03130c;
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding-bottom:82px;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,#f4d500,#10a34a 62%,#075b35);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:1000;
  font-size:27px;
  box-shadow:0 8px 20px #0a8a4530;
}

.brand b{
  font-size:20px;
  letter-spacing:-.5px;
}

.brand span{
  color:var(--g);
}

.tag{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.bell{
  margin-left:auto;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  position:relative;
  font-size:19px;
}

.badge{
  position:absolute;
  right:-2px;
  top:-3px;
  background:var(--red);
  color:#fff;
  border-radius:99px;
  font-size:9px;
  min-width:17px;
  height:17px;
  display:grid;
  place-items:center;
  font-weight:900;
}

.page{
  display:none;
  padding:14px 15px;
}

.page.on{
  display:block;
}

.search{
  display:flex;
  gap:8px;
  margin:5px 0 13px;
}

.search input{
  flex:1;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:15px;
  outline:0;
  background:#f8fbf9;
}

.iconbtn,
.btn{
  border:0;
  border-radius:13px;
  padding:12px 14px;
  font-weight:900;
}

.iconbtn{
  background:var(--soft);
}

.btn{
  background:var(--g);
  color:#fff;
}

.btn.dark{
  background:var(--dark);
}

.btn.light{
  background:#fff;
  color:var(--gd);
  border:1px solid #b9d7c6;
}

.hero{
  background:linear-gradient(135deg,var(--gd),#0a9b49);
  color:#fff;
  border-radius:23px;
  padding:20px;
  margin-bottom:15px;
  overflow:hidden;
}

.hero h1{
  font-size:26px;
  margin:0 0 7px;
}

.hero p{
  margin:0 0 14px;
  color:#e3f6ea;
  font-size:13px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:8px 0 18px;
}

.quick button{
  border:0;
  background:#fff;
  border-radius:15px;
  padding:10px 4px;
  font-size:10px;
  font-weight:900;
  color:#27352e;
  box-shadow:0 5px 18px #0a3b2510;
}

.quick i{
  font-style:normal;
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 1px 10px;
}

.head h2,
.head h3{
  margin:0;
}

.link{
  border:0;
  background:transparent;
  color:var(--g);
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.product{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.pimg{
  height:145px;
  background:linear-gradient(135deg,#edf6f0,#fff);
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.pimg img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pemoji{
  font-size:58px;
}

.heart{
  position:absolute;
  right:8px;
  top:8px;
  border:0;
  background:#fff;
  border-radius:99px;
  width:32px;
  height:32px;
  font-size:18px;
}

.info{
  padding:10px;
}

.name{
  font-weight:900;
  font-size:13px;
  line-height:1.2;
}

.price{
  color:var(--g);
  font-weight:1000;
  margin-top:5px;
}

.muted{
  color:var(--muted);
  font-size:11px;
}

.verify{
  color:var(--g);
  font-weight:900;
}

.rating{
  font-size:11px;
  margin:4px 0;
}

.chiprow{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:3px;
}

.chip{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  border-radius:99px;
  padding:9px 12px;
  font-weight:800;
  font-size:11px;
}

.chip.sel{
  background:var(--gd);
  color:#fff;
  border-color:var(--gd);
}

.panel{
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.form{
  display:grid;
  gap:10px;
}

.form label{
  font-size:11px;
  font-weight:900;
}

.form input,
.form select,
.form textarea{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:0;
  font:inherit;
  background:#fbfdfc;
}

.form textarea{
  min-height:105px;
  resize:vertical;
}

.photos{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.slot{
  aspect-ratio:1;
  border:1.5px dashed #9cc5aa;
  border-radius:12px;
  background:#f4faf6;
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative;
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slot b{
  font-size:22px;
  color:var(--g);
}

.slot small{
  position:absolute;
  bottom:3px;
  left:0;
  right:0;
  text-align:center;
  background:#0008;
  color:#fff;
  font-size:8px;
}

.notice{
  padding:10px 12px;
  background:#eef9f1;
  border-radius:12px;
  color:#176238;
  font-size:11px;
  font-weight:800;
}

.scorebox{
  background:linear-gradient(135deg,#eaf9ee,#fff);
  border:1px solid #bde0c9;
  border-radius:18px;
  padding:15px;
}

.score{
  font-size:38px;
  color:var(--g);
  font-weight:1000;
}

.progress{
  height:9px;
  background:#dcebe2;
  border-radius:99px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:var(--g);
  width:92%;
}

.status{
  display:inline-block;
  border-radius:99px;
  padding:5px 8px;
  background:#eef8f1;
  color:#13753d;
  font-size:10px;
  font-weight:900;
}

.storeHero{
  border-radius:20px;
  background:linear-gradient(135deg,#063d25,#0da04b);
  color:#fff;
  padding:16px;
}

.storeLogo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#fff;
  color:var(--gd);
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:1000;
  overflow:hidden;
}

.storeLogo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  grid-template-rows:120px 120px;
  gap:5px;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
}

.gallery div{
  background:#eef6f0;
  overflow:hidden;
}

.gallery div:first-child{
  grid-row:span 2;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detailcard{
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
}

.chatlist{
  display:grid;
  gap:9px;
}

.chatitem{
  display:flex;
  gap:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#e7f5ec;
  display:grid;
  place-items:center;
  font-size:21px;
  font-weight:900;
}

.bubble{
  max-width:80%;
  padding:10px 12px;
  border-radius:15px;
  background:#edf6f0;
  font-size:12px;
}

.mine{
  margin-left:auto;
  background:#0b8744;
  color:#fff;
}

.chatmsgs{
  height:55vh;
  overflow:auto;
  padding:10px 0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.chatbar{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  padding:9px 0;
  display:flex;
  gap:7px;
}

.chatbar input{
  flex:1;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}

.offer{
  border:1px solid #b8dfc5;
  background:#f1faf4;
  border-radius:14px;
  padding:10px;
  font-weight:900;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  z-index:30;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 25px #001a0d10;
}

.nav{
  border:0;
  background:#fff;
  color:#66736c;
  font-size:9px;
  font-weight:800;
}

.nav i{
  font-style:normal;
  font-size:20px;
  display:block;
}

.nav.active{
  color:var(--g);
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  padding:28px;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:#001a0d88;
  z-index:50;
  display:none;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:15px;
}

.close{
  float:right;
  border:0;
  background:#edf5ef;
  border-radius:99px;
  width:35px;
  height:35px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.danger{
  color:#c83425;
}

.small{
  font-size:10px;
}

.tabs2{
  display:flex;
  gap:7px;
  overflow:auto;
  margin:8px 0;
}

.tabs2 button{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  border-radius:99px;
  padding:8px 11px;
  font-size:10px;
  font-weight:800;
}

.tabs2 button.on{
  background:var(--gd);
  color:#fff;
}

.order{
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin:8px 0;
}

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:#102018;
  color:#fff;
  padding:11px 15px;
  border-radius:13px;
  z-index:100;
  display:none;
  font-size:12px;
  font-weight:800;
}

.toast.on{
  display:block;
}

@media(min-width:700px){

  body{
    padding:20px 0;
  }

  .app{
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px #0005;
  }

}

</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="brand">

    <div class="logo">K</div>

    <div>
      <b>KUANZA <span>LINE</span></b>
      <div class="tag">Compra. Vende. Confia.</div>
    </div>

    <button
      class="bell"
      onclick="showNotifications()"
      aria-label="Notificações"
    >
      🔔
      <span id="notifBadge" class="badge">0</span>
    </button>

  </div>

</header>


<main>


<section id="home" class="page on">

  <div class="search">

    <input
      id="q"
      placeholder="O que estás à procura?"
      oninput="loadProducts()"
    >

    <button
      class="iconbtn"
      onclick="loadProducts()"
    >
      ⌕
    </button>

  </div>


  <div class="hero">

    <h1>Compra com confiança.</h1>

    <p>
      Produtos reais, vendedores verificados e uma experiência feita para Angola.
    </p>

    <button
      class="btn light"
      onclick="go('explore')"
    >
      Explorar produtos
    </button>

  </div>


  <div class="quick">

    <button
      onclick="go('explore');filterCat('Eletrónicos')"
    >
      <i>▦</i>
      Categorias
    </button>

    <button onclick="go('store')">
      <i>🏪</i>
      Lojas
    </button>

    <button onclick="go('favorites')">
      <i>♥</i>
      Favoritos
    </button>

    <button onclick="go('cart')">
      <i>🛒</i>
      Carrinho
    </button>

    <button onclick="go('seller')">
      <i>▥</i>
      Vendedor
    </button>

  </div>


  <div class="head">

    <h3>Em destaque</h3>

    <button
      class="link"
      onclick="go('explore')"
    >
      Ver todos
    </button>

  </div>


  <div
    id="homeProducts"
    class="grid"
  ></div>

</section>



<section id="explore" class="page">

  <div class="head">

    <h3>🔎 Explorar</h3>

    <select
      id="sort"
      onchange="loadProducts()"
      style="border:1px solid var(--line);border-radius:10px;padding:8px"
    >

      <option value="">Relevantes</option>
      <option value="low">Menor preço</option>
      <option value="high">Maior preço</option>

    </select>

  </div>


  <div class="search">

    <input
      id="eq"
      placeholder="Pesquisar produtos ou lojas"
      oninput="loadProducts()"
    >

  </div>


  <div
    id="cats"
    class="chiprow"
  ></div>


  <div
    id="exploreProducts"
    class="grid"
  ></div>

</section>



<section id="product" class="page">

  <div id="productBox"></div>

</section>



<section id="store" class="page">

  <div class="head">

    <h3>🏪 Lojas</h3>

  </div>

  <div id="storeBox">

    <div class="empty">
      Carregando lojas...
    </div>

  </div>

</section>



<section id="favorites" class="page">

  <div class="head">

    <h3>❤️ Favoritos</h3>

  </div>

  <div id="favoritesBox"></div>

</section>



<section id="cart" class="page">

  <div class="head">

    <h3>🛒 Carrinho</h3>

  </div>

  <div id="cartBox"></div>

</section>



<section id="account" class="page">

  <div class="head">

    <h3>👤 Minha conta</h3>

  </div>

  <div id="accountBox"></div>

</section>



<section id="seller" class="page">

  <div class="head">

    <h3>🛍️ Área do vendedor</h3>

  </div>

  <div id="sellerBox"></div>

</section>



<section id="orders" class="page">

  <div class="head">

    <h3>📦 Meus pedidos</h3>

  </div>

  <div id="ordersBox"></div>

</section>



<section id="chats" class="page">

  <div id="chatListBox"></div>

</section>



<section id="chat" class="page">

  <div id="chatBox"></div>

</section>


</main>


<nav class="bottom">

  <button
    class="nav active"
    data-page="home"
    onclick="go('home')"
  >
    <i>⌂</i>
    Início
  </button>

  <button
    class="nav"
    data-page="explore"
    onclick="go('explore')"
  >
    <i>⌕</i>
    Explorar
  </button>

  <button
    class="nav"
    data-page="favorites"
    onclick="go('favorites')"
  >
    <i>♥</i>
    Favoritos
  </button>

  <button
    class="nav"
    data-page="cart"
    onclick="go('cart')"
  >
    <i>🛒</i>
    Carrinho
  </button>

  <button
    class="nav"
    data-page="account"
    onclick="go('account')"
  >
    <i>👤</i>
    Conta
  </button>

</nav>

</div>


<div
  id="modal"
  class="modal"
>
  <div class="sheet">

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <div id="modalContent"></div>

  </div>
</div>


<div
  id="toast"
  class="toast"
></div>



<script>

const $ = id => document.getElementById(id);


let token =
  localStorage.getItem('kuanza_token') ||
  localStorage.getItem('klToken') ||
  '';


let me = null;
let currentProduct = null;
let currentConversation = null;
let activeCat = 'Todos';
let photoData = [];


const API = '';


async function api(path, options = {}){

  const opts = {
    ...options,

    headers:{
      'Content-Type':'application/json',
      ...(options.headers || {})
    }

  };


  if(token){

    opts.headers.Authorization =
      'Bearer ' + token;

  }


  const response =
    await fetch(API + path, opts);


  let data = {};

  try{

    data = await response.json();

  }catch(e){

    data = {};

  }


  if(!response.ok){

    const message =
      data.error ||
      data.message ||
      ('Erro ' + response.status);

    throw new Error(message);

  }


  return data;

}


function toast(message){

  const el = $('toast');

  if(!el)return;

  el.textContent = message;

  el.classList.add('on');

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(
      () => el.classList.remove('on'),
      2600
    );

}


function money(value){

  return Number(value || 0).toLocaleString(
    'pt-AO',
    {
      minimumFractionDigits:0,
      maximumFractionDigits:0
    }
  ) + ' Kz';

}


function esc(value){

  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


function closeModal(){

  const modal = $('modal');

  if(modal){
    modal.classList.remove('show');
  }

}


function openModal(html){

  $('modalContent').innerHTML = html;

  $('modal').classList.add('show');

}


function go(page){

  document
    .querySelectorAll('.page')
    .forEach(
      p => p.classList.remove('on')
    );


  const target = $(page);

  if(target){
    target.classList.add('on');
  }


  document
    .querySelectorAll('.nav')
    .forEach(
      n => {
        n.classList.toggle(
          'active',
          n.dataset.page === page
        );
      }
    );


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });


  if(page === 'home'){
    loadProducts();
  }


  if(page === 'explore'){
    loadProducts();
  }


  if(page === 'favorites'){
    loadFavorites();
  }


  if(page === 'cart'){
    loadCart();
  }


  if(page === 'account'){
    loadAccount();
  }


  if(page === 'seller'){
    loadSeller();
  }


  if(page === 'orders'){
    loadOrders();
  }


  if(page === 'chats'){
    loadChats();
  }


  if(page === 'store'){
    loadStores();
  }

}


function productImage(product){

  const photos =
    Array.isArray(product?.photos)
      ? product.photos
      : [];


  if(photos.length){

    return `
      <img
        src="${photos[0]}"
        alt="${esc(product.name)}"
      >
    `;

  }


  return `
    <div class="pemoji">
      🛍️
    </div>
  `;

}


function card(product){

  if(!product)return '';


  const score =
    product.seller?.score ??
    product.sellerScore ??
    50;


  const verified =
    product.seller?.verified
      ? '<span class="verify">✓ Verificado</span>'
      : '';


  return `

    <div class="product">

      <div class="pimg">

        ${productImage(product)}

        <button
          class="heart"
          onclick="event.stopPropagation();toggleFav('${product.id}',this)"
          aria-label="Favorito"
        >
          ♡
        </button>

      </div>


      <div

async function loadProducts(){

  try{

    const data =
      await api('/api/products');


    let products =
      Array.isArray(data)
        ? data
        : (
            data.products ||
            data.items ||
            data.data ||
            []
          );


    const q =
      (
        $('q')?.value ||
        $('eq')?.value ||
        ''
      )
      .toLowerCase()
      .trim();


    if(q){

      products =
        products.filter(
          p =>
            String(p.name || '')
              .toLowerCase()
              .includes(q) ||

            String(p.category || '')
              .toLowerCase()
              .includes(q)
        );

    }


    if(activeCat !== 'Todos'){

      products =
        products.filter(
          p => p.category === activeCat
        );

    }


    const sort =
      $('sort')?.value;


    if(sort === 'low'){

      products.sort(
        (a,b) =>
          Number(a.price) -
          Number(b.price)
      );

    }


    if(sort === 'high'){

      products.sort(
        (a,b) =>
          Number(b.price) -
          Number(a.price)
      );

    }


    if($('homeProducts')){

      $('homeProducts').innerHTML =
        products
          .slice(0,6)
          .map(card)
          .join('') ||

        '<div class="empty">Nenhum produto encontrado.</div>';

    }


    if($('exploreProducts')){

      $('exploreProducts').innerHTML =
        products
          .map(card)
          .join('') ||

        '<div class="empty">Nenhum produto encontrado.</div>';

    }


  }catch(e){

    console.error(e);


    if($('homeProducts')){

      $('homeProducts').innerHTML =
        `<div class="empty">${esc(e.message)}</div>`;

    }


    if($('exploreProducts')){

      $('exploreProducts').innerHTML =
        `<div class="empty">${esc(e.message)}</div>`;

    }

  }

}

async function submitAuth(e,mode){
  e.preventDefault();

  try{
    const email=$('authEmail').value.trim();
    const password=$('authPassword').value;

    const body={
      email,
      password
    };

    if(mode==='register'){
      body.name=$('authName').value.trim();
    }

    const r=await api('/api/'+mode,{
      method:'POST',
      body:JSON.stringify(body)
    });

    if(!r.token){
      throw new Error('O servidor não devolveu o token de sessão.');
    }

    token=r.token;

    localStorage.setItem('kuanza_token',token);
    localStorage.setItem('klToken',token);

    const fresh=await api('/api/me');
    me=fresh.user||fresh;

    closeModal();

    toast(mode==='login'
      ? 'Login realizado ✓'
      : 'Conta criada com sucesso ✓'
    );

    await loadAccount();
    go('account');

  }catch(e){
    toast(e.message||'Não foi possível concluir a operação.');
  }
}


async function switchRole(){
  try{
    if(!token){
      toast('Inicia sessão primeiro.');
      go('account');
      return;
    }

    if(!me){
      const r=await api('/api/me');
      me=r.user||r;
    }

    const currentRole=me.role==='seller'?'seller':'buyer';
    const newRole=currentRole==='seller'?'buyer':'seller';

    const result=await api('/api/me/role',{
      method:'PATCH',
      body:JSON.stringify({
        role:newRole
      })
    });

    const returned=result.user||result;

    if(returned.role!==newRole){
      throw new Error('O servidor não confirmou a mudança de conta.');
    }

    const fresh=await api('/api/me');
    me=fresh.user||fresh;

    if(me.role!==newRole){
      throw new Error('A mudança de conta não foi persistida.');
    }

    toast(
      newRole==='seller'
        ? 'Agora você é vendedor ✓'
        : 'Agora você é comprador ✓'
    );

    await loadAccount();

  }catch(e){
    toast(e.message||'Erro ao mudar de conta.');
  }
}

function handlePhotos(e){

  const files=Array.from(e.target.files||[]);

  if(files.length<5 || files.length>10){
    toast('Selecione entre 5 e 10 fotos reais do produto.');
    e.target.value='';
    photoData=[];
    renderPhotoSlots();
    return;
  }

  photoData=[];

  let loaded=0;

  files.forEach(file=>{

    if(!file.type.startsWith('image/')){
      loaded++;
      return;
    }

    const reader=new FileReader();

    reader.onload=()=>{
      photoData.push(reader.result);
      loaded++;

      if(loaded===files.length){
        renderPhotoSlots();
      }
    };

    reader.readAsDataURL(file);

  });
}


function renderPhotoSlots(){

  const box=$('photoSlots');

  if(!box)return;

  if(!photoData.length){
    box.innerHTML=`
      <div class="photoHint">
        Selecione de 5 a 10 fotos.
      </div>
    `;
    return;
  }

  box.innerHTML=photoData.map(
    (src,i)=>`
      <div class="photoPreview">
        <img src="${src}" alt="Foto ${i+1}">
        <span>${i+1}</span>
      </div>
    `
  ).join('');
}


async function publish(e){
  e.preventDefault();

  try{

    if(!me || me.role!=='seller'){
      throw new Error('Apenas vendedores podem publicar produtos.');
    }

    if(photoData.length<5 || photoData.length>10){
      throw new Error('O produto precisa de 5 a 10 fotos.');
    }

    const name=$('productName').value.trim();
    const price=Number($('productPrice').value);
    const category=$('productCategory').value;
    const description=$('productDescription').value.trim();

    if(!name){
      throw new Error('Digite o nome do produto.');
    }

    if(!price || price<=0){
      throw new Error('Digite um preço válido.');
    }

    if(!category){
      throw new Error('Selecione uma categoria.');
    }

    if(description.length<15){
      throw new Error('A descrição precisa ter pelo menos 15 caracteres.');
    }

    await api('/api/products',{
      method:'POST',
      body:JSON.stringify({
        name,
        price,
        category,
        description,
        images:photoData
      })
    });

    toast('Produto publicado com sucesso ✓');

    photoData=[];

    await loadSeller();

  }catch(e){
    toast(e.message||'Não foi possível publicar o produto.');
  }
}


async function startChat(sellerId,productId){

  try{

    if(!token){
      toast('Inicia sessão para conversar com o vendedor.');
      go('account');
      return;
    }

    if(String(sellerId)===String(me?.id)){
      toast('Este produto pertence à sua loja.');
      return;
    }

    const r=await api('/api/conversations',{
      method:'POST',
      body:JSON.stringify({
        sellerId,
        productId
      })
    });

    const conversation=r.conversation||r;

    if(!conversation?.id){
      throw new Error('Não foi possível abrir a conversa.');
    }

    currentConversation=conversation;

    await loadChat(conversation.id);

    go('chat');

  }catch(e){
    toast(e.message||'Não foi possível iniciar a conversa.');
  }
}


async function loadChats(){

  if(!token){
    toast('Inicia sessão para ver as conversas.');
    go('account');
    return;
  }

  try{

    const response=await api('/api/conversations');

    const conversations=Array.isArray(response)
      ? response
      : (
          response.conversations||
          response.items||
          response.data||
          []
        );

    $('chatsContent').innerHTML=

      conversations.length

      ? conversations.map(c=>{

          const other=c.otherUser||c.other||{};
          const last=c.lastMessage||c.last||{};

          return `
            <button
              class="chatItem"
              onclick="loadChat('${esc(c.id)}');go('chat')"
            >

              <div class="avatar small">
                ${esc((other.name||'U').charAt(0).toUpperCase())}
              </div>

              <div class="chatInfo">

                <strong>
                  ${esc(other.name||'Utilizador')}
                </strong>

                <span>
                  ${esc(last.text||(
                    last.offer
                    ? 'Oferta enviada'
                    : 'Abrir conversa'
                  ))}
                </span>

              </div>

            </button>
          `;

        }).join('')

      : `
        <div class="empty">

          <div class="emptyIcon">💬</div>

          <h3>Nenhuma conversa</h3>

          <p class="muted">
            Quando conversar com um vendedor,
            suas conversas aparecerão aqui.
          </p>

        </div>
      `;

  }catch(e){

    $('chatsContent').innerHTML=`
      <div class="card">
        <h3>Erro ao carregar conversas</h3>
        <p>${esc(e.message||'Erro desconhecido')}</p>
        <button class="btn" onclick="loadChats()">
          Tentar novamente
        </button>
      </div>
    `;

  }
}


async function loadChat(id){

  try{

    if(!token){
      toast('Inicia sessão primeiro.');
      go('account');
      return;
    }

    const response=await api('/api/conversations/'+id);

    currentConversation=
      response.conversation||
      response;

    const messages=
      Array.isArray(response.messages)
      ? response.messages
      : [];

    $('chatTitle').textContent=
      currentConversation?.otherUser?.name||
      currentConversation?.other?.name||
      'Conversa';

    $('chatMessages').innerHTML=
      messages.length
      ? messages.map(messageHtml).join('')
      : `
        <div class="empty chatEmpty">
          <p class="muted">
            Nenhuma mensagem ainda.
          </p>
        </div>
      `;

    setTimeout(()=>{
      const box=$('chatMessages');
      if(box){
        box.scrollTop=box.scrollHeight;
      }
    },50);

  }catch(e){

    toast(e.message||'Não foi possível abrir a conversa.');

  }
}


function messageHtml(m){

  const mine=
    String(m.senderId||m.userId)===String(me?.id);

  let content='';

  if(m.offer){

    content=`
      <div class="offerBubble">
        <small>OFERTA</small>
        <strong>${money(m.offer)}</strong>
      </div>
    `;

  }else{

    content=`
      <div class="messageText">
        ${esc(m.text||'')}
      </div>
    `;

  }

  return `
    <div class="message ${mine?'mine':'theirs'}">
      ${content}
      <small class="messageTime">
        ${m.createdAt
          ? new Date(m.createdAt).toLocaleString('pt-AO')
          : ''
        }
      </small>
    </div>
  `;
}


async function sendMessage(){

  try{

    if(!currentConversation?.id){
      throw new Error('Nenhuma conversa selecionada.');
    }

    const input=$('messageInput');

    const text=input.value.trim();

    if(!text){
      return;
    }

    await api(
      '/api/conversations/'+currentConversation.id,
      {
        method:'POST',
        body:JSON.stringify({
          text
        })
      }
    );

    input.value='';

    await loadChat(currentConversation.id);

  }catch(e){
    toast(e.message||'Não foi possível enviar a mensagem.');
  }
}


async function sendOffer(){

  try{

    if(!currentConversation?.id){
      throw new Error('Nenhuma conversa selecionada.');
    }

    const value=prompt(
      'Digite o valor da sua oferta em Kz:'
    );

    if(value===null){
      return;
    }

    const amount=Number(
      String(value)
        .replace(/\s/g,'')
        .replace(/\./g,'')
        .replace(',','.')
    );

    if(!amount || amount<=0){
      throw new Error('Digite um valor de oferta válido.');
    }

    await api(
      '/api/conversations/'+currentConversation.id,
      {
        method:'POST',
        body:JSON.stringify({
          offer:amount
        })
      }
    );

    toast('Oferta enviada ✓');

    await loadChat(currentConversation.id);

  }catch(e){
    toast(e.message||'Não foi possível enviar a oferta.');
  }
}


async function loadOrders(){

  if(!token){
    toast('Inicia sessão para ver os pedidos.');
    go('account');
    return;
  }

  try{

    const response=await api('/api/orders');

    const orders=Array.isArray(response)
      ? response
      : (
          response.orders||
          response.items||
          response.data||
          []
        );

    $('ordersContent').innerHTML=

      orders.length

      ? orders.map(o=>{

          const product=o.product||{};
          const name=
            o.productName||
            product.name||
            'Produto';

          const price=
            Number(
              o.price||
              product.price||
              0
            );

          const status=o.status||'pending';

          return `
            <div class="orderCard">

              <div>

                <strong>
                  ${esc(name)}
                </strong>

                <p class="muted">
                  ${money(price)}
                </p>

              </div>

              <span class="status">
                ${esc(status)}
              </span>

            </div>
          `;

        }).join('')

      : `
        <div class="empty">

          <div class="emptyIcon">📦</div>

          <h3>Nenhum pedido</h3>

          <p class="muted">
            Os seus pedidos aparecerão aqui.
          </p>

          <button
            class="btn"
            onclick="go('explore')"
          >
            Explorar produtos
          </button>

        </div>
      `;

  }catch(e){

    $('ordersContent').innerHTML=`
      <div class="card">

        <h3>Erro ao carregar pedidos</h3>

        <p>${esc(e.message||'Erro desconhecido')}</p>

        <button
          class="btn"
          onclick="loadOrders()"
        >
          Tentar novamente
        </button>

      </div>
    `;

  }
}


function showNotifications(){

  toast(
    'O centro de notificações será ativado numa próxima versão.'
  );

}


async function boot(){

  try{

    if(token){

      try{

        const r=await api('/api/me');

        me=r.user||r;

      }catch(e){

        token='';

        me=null;

        localStorage.removeItem('kuanza_token');
        localStorage.removeItem('klToken');

      }

    }

    renderCats();

    await loadProducts();

    if(location.hash){

      const page=location.hash.replace('#','');

      if([
        'home',
        'explore',
        'favorites',
        'cart',
        'account',
        'seller',
        'orders',
        'chats',
        'chat'
      ].includes(page)){

        go(page);

      }else{

        go('home');

      }

    }else{

      go('home');

    }

  }catch(e){

    console.error('Boot error:',e);

    toast(
      'A aplicação iniciou com limitações. Recarregue a página.'
    );

  }

}


window.addEventListener(
  'hashchange',
  ()=>{
    const page=location.hash.replace('#','');

    if(page){
      go(page);
    }
  }
);


document.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Escape'){
      closeModal();
    }
  }
);


boot();

</script>
