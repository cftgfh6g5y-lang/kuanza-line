<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#087443">
<meta name="description" content="Kuanza Line — Compra. Vende. Confia.">
<title>Kuanza Line</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7f6;
  color:#17221d;
  padding-bottom:82px;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:#f5f7f6;
}

.topbar{
  position:sticky;

  z-index:50;
  background:#087443;

  padding:14px 16px;

.topbar-inner{

.logo{

.icon-btn{

.hero{

.chips{

.grid{

.product{

.pimg{

.info{

.price{

}

.muted{

}

.rating{

}

.verify{

}

.btn{

  border-radius:13px;

.btn-primary{

.btn-secondary{

.form-group input,

.bottom-nav{
  position:fixed;
  bottom:0;

  transform:translateX(-50%);

  background:white;
  border-top:1px solid #e3eae5;

  grid-template-columns:repeat(5,1fr);

.nav-btn{
  border:0;
  background:none;
  color:#77827c;
  padding:7px 3px;

}

.nav-btn strong{

.gallery{

.gallery img,

.detail-title{

}

.detail-description{

.seller-box{

.seller-line{

}

.seller-name{

}

.score-box{

  border:1px solid #d8eadf;

}

.score-number{

  color:#087443;

  font-weight:800;
}

.score-bar{
  height:9px;
  background:#dce9e1;
  border-radius:99px;
  overflow:hidden;
  margin-top:9px;
}

.score-fill{
  height:100%;
  background:#087443;
  border-radius:99px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#087443;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Poppins,sans-serif;
  font-weight:800;

}

.profile-name{

  font-size:19px;

}

.stats{

  grid-template-columns:repeat(3,1fr);

}

.stat{

}

.stat strong{

.modal{

.modal-box{
  width:min(760px,100%);

.modal-head{

.modal-head h3{

}

.close{

}

.notification{
  background:#f5f8f6;
  border-radius:14px;
  padding:13px;
  margin-bottom:9px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:91px;
  transform:translateX(-50%);
  z-index:200;
  background:#17221d;
  color:white;
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  max-width:90%;
  text-align:center;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:10px;
}

.photo-item{
  aspect-ratio:1;

.photo-item img{

.chat-list{

.message{

}

}

.mb{

}

.order-status{

    gap:9px;
  }

</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-mark">K</div>
      <div>
        <div class="logo-text">Kuanza Line</div>
        <div class="logo-sub">Compra. Vende. Confia.</div>
      </div>
    </div>

    <button class="icon-btn" onclick="showNotifications()" aria-label="Notificações">
      🔔
    </button>
  </div>
</header>

<main id="appContent"></main>

<nav class="bottom-nav">
  <button id="navHome" class="nav-btn active" onclick="go('home')">
    <strong>⌂</strong>
    Início
  </button>

  <button id="navExplore" class="nav-btn" onclick="go('explore')">
    <strong>⌕</strong>
    Explorar
  </button>

  <button id="navFav" class="nav-btn" onclick="go('favorites')">
    <strong>♡</strong>
    Favoritos
  </button>

  <button id="navCart" class="nav-btn" onclick="go('cart')">
    <strong>🛒</strong>
    Carrinho
  </button>

  <button id="navAccount" class="nav-btn" onclick="go('account')">
    <strong>♙</strong>
    Conta
  </button>
</nav>

</div>

<div id="modal" class="modal hidden" onclick="modalBackground(event)">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const API = '';

let token =
  localStorage.getItem('kuanza_token') ||
  localStorage.getItem('klToken') ||
  '';

let me = null;
let products = [];
let favorites = [];
let cart = [];
let orders = [];
let conversations = [];
let currentProduct = null;
let currentConversation = null;
let activeCat = 'Todos';
let selectedPhotos = [];

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function money(value){
  return Number(value || 0).toLocaleString('pt-AO') + ' Kz';
}

function toast(message){
  const box = $('toast');
  if(!box) return;

  box.textContent = message;
  box.classList.remove('hidden');

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    box.classList.add('hidden');
  },3000);
}

async function api(path,options={}){
  const headers = {
    ...(options.body ? {'Content-Type':'application/json'} : {}),
    ...(options.headers || {})
  };

  if(token){
    headers.Authorization = 'Bearer ' + token;
  }

  const response = await fetch(API + path,{
    ...options,
    headers
  });

  const text = await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : {};
  }catch{
    data = text;
  }

  if(!response.ok){
    throw new Error(
      data?.error ||
      data?.message ||
      `Erro ${response.status}`
    );
  }

  return data;
}

function normalizeArray(data,keys=[]){
  if(Array.isArray(data)) return data;

  for(const key of keys){
    if(Array.isArray(data?.[key])){
      return data[key];
    }
  }

  if(Array.isArray(data?.data)){
    return data.data;
  }

  if(Array.isArray(data?.items)){
    return data.items;
  }

  return [];
}

function setActiveNav(page){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.remove('active');
  });

  const map = {
    home:'navHome',
    explore:'navExplore',
    favorites:'navFav',
    cart:'navCart',
    account:'navAccount'
  };

  if($(map[page])){
    $(map[page]).classList.add('active');
  }
}

async function go(page){
  setActiveNav(page);

  try{
    if(page === 'home'){
      await loadHome();
      return;
    }

    if(page === 'explore'){
      await loadExplore();
      return;
    }

    if(page === 'favorites'){
      await loadFavorites();
      return;
    }

    if(page === 'cart'){
      await loadCart();
      return;
    }

    if(page === 'account'){
      await loadAccount();
      return;
    }

    if(page === 'sell'){
      await loadSell();
      return;
    }

    if(page === 'store'){
      await loadStore();
      return;
    }

    if(page === 'dashboard'){
      await loadDashboard();
      return;
    }

    if(page === 'chats'){
      await loadConversations();
      return;
    }
  }catch(e){
    console.error(e);
    toast(e.message || 'Ocorreu um erro.');
  }
}

async function loadHome(){
  const box = $('appContent');

  box.innerHTML = `
    <div class="page">

      <section class="hero">
        <h1>Compra. Vende. Confia.</h1>
        <p>
          O marketplace feito para comprar e vender com mais
          segurança em Angola.
        </p>

        <div class="search-box">
          <input
            id="q"
            placeholder="O que procuras hoje?"
            onkeydown="if(event.key==='Enter') go('explore')"
          >
          <button onclick="go('explore')">⌕</button>
        </div>
      </section>

      <div class="section-title">
        <h2>Categorias</h2>
        <button class="link" onclick="go('explore')">Ver tudo</button>
      </div>

      <div id="homeCats" class="chips"></div>

      <div class="section-title">
        <h2>Produtos recentes</h2>
        <button class="link" onclick="go('explore')">Explorar</button>
      </div>

      <div id="homeProducts" class="grid">
        <div class="empty" style="grid-column:1/-1">
          A carregar produtos...
        </div>
      </div>

      <div class="section-title">
        <h2>Kuanza Line</h2>
      </div>

      <div class="card">
        <strong>🛡️ Compra com confiança</strong>
        <p class="muted mt">
          Avaliações, reputação dos vendedores e Kuanza Score
          ajudam-te a tomar decisões melhores.
        </p>
      </div>

    </div>
  `;

  renderCats('homeCats');

  try{
    const response = await api('/api/products');
    products = normalizeArray(response,['products','items']);
  }catch(e){
    products = [];
    console.error(e);
  }

  $('homeProducts').innerHTML =
    products.slice(0,6).map(card).join('') ||
    `
      <div class="empty" style="grid-column:1/-1">
        Nenhum produto encontrado.
      </div>
    `;
}

function categoryIcon(category){
  const icons = {
    'Todos':'🛍️',
    'Eletrônicos':'📱',
    'Moda':'👕',
    'Casa':'🏠',
    'Beleza':'💄',
    'Alimentação':'🍔',
    'Desporto':'⚽',
    'Veículos':'🚗',
    'Serviços':'🛠️',
    'Outros':'📦'
  };

  return icons[category] || '📦';
}

function getCategories(){
  const set = new Set(
    products
      .map(p=>String(p.category || '').trim())
      .filter(Boolean)
  );

  return [
    'Todos',
    ...Array.from(set),
    'Outros'
  ].filter((x,i,a)=>a.indexOf(x)===i);
}

function renderCats(targetId){
  const target = $(targetId);
  if(!target) return;

  target.innerHTML = getCategories()
    .map(c=>`
      <button
        class="chip ${c===activeCat?'sel':''}"
        onclick="openCategory('${esc(c)}')"
      >
        ${categoryIcon(c)} ${esc(c)}
      </button>
    `)
    .join('');
}

function openCategory(category){
  activeCat = category;
  go('explore');
}

async function loadExplore(){
  const box = $('appContent');

  box.innerHTML = `
    <div class="page">

      <div class="section-title">
        <h2>Explorar</h2>
      </div>

      <div class="search-box" style="margin-top:0;background:white;border:1px solid #e0e8e3">
        <input
          id="eq"
          placeholder="Pesquisar produtos..."
          oninput="filterExplore()"
        >
        <button onclick="filterExplore()">⌕</button>
      </div>

      <div class="chips mt" id="exploreCats"></div>

      <div class="card mt">
        <select id="exploreSort" onchange="filterExplore()">
          <option value="recent">Mais recentes</option>
          <option value="low">Menor preço</option>
          <option value="high">Maior preço</option>
        </select>
      </div>

      <div id="exploreProducts" class="grid">
        <div class="empty" style="grid-column:1/-1">
          A carregar...
        </div>
      </div>

    </div>
  `;

  renderCats('exploreCats');

  try{
    const response = await api('/api/products');
    products = normalizeArray(response,['products','items']);
  }catch(e){

}

function filterExplore(){
  const search =
    String($('eq')?.value || '')
      .toLowerCase()
      .trim();

  const sort =
    $('exploreSort')?.value || 'recent';

  let list = [...products];

  if(search){
    list = list.filter(p =>
      String(p.name || '').toLowerCase().includes(search) ||
      String(p.description || '').toLowerCase().includes(search)
    );
  }

  if(activeCat !== 'Todos'){
    list = list.filter(p =>
      String(p.category || '').toLowerCase() ===
      activeCat.toLowerCase()
    );
  }

  if(sort === 'low'){
    list.sort((a,b)=>
      Number(a.price || 0)-Number(b.price || 0)
    );
  }

  if(sort === 'high'){
    list.sort((a,b)=>
      Number(b.price || 0)-Number(a.price || 0)
    );
  }

  const target = $('exploreProducts');

  if(target){
    target.innerHTML =
      list.map(card).join('') ||
      `
        <div class="empty" style="grid-column:1/-1">
          Nenhum produto encontrado.
        </div>
      `;
  }
}

function addToCart(id){

  const product = products.find(
    p=>String(p.id)===String(id)
  );

  if(!product){
    toast('Produto não encontrado.');
    return;
  }

  const existing = cart.find(
    item=>String(item.id)===String(id)
  );

  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price || 0),

      image:
        product.images?.[0] ||
        product.image ||
        '',

      sellerId:
        product.sellerId ||
        product.seller?.id ||
        null,

      quantity:1

    });

  }

  saveCart();

  toast(
    'Produto adicionado ao carrinho 🛒'
  );
}


function changeQuantity(id,delta){

  const item = cart.find(
    x=>String(x.id)===String(id)
  );

  if(!item) return;

  item.quantity += delta;

  if(item.quantity <= 0){

    cart = cart.filter(
      x=>String(x.id)!==String(id)
    );

  }

  saveCart();

  loadCart();
}


function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum +
      Number(item.price || 0) *
      Number(item.quantity || 1),
    0
  );

}

function handlePhotoSelection(event){

  const files =
    Array.from(
      event.target.files || []
    );


  if(!files.length){
    return;
  }


  if(files.length > 10){

    toast(
      'Podes selecionar no máximo 10 fotos.'
    );

    event.target.value = '';

    return;
  }


  selectedPhotos = [];


  let completed = 0;


  files.forEach(file=>{

    if(!file.type.startsWith('image/')){
      completed++;
      return;
    }


    const reader =
      new FileReader();


    reader.onload = function(){

      selectedPhotos.push(
        reader.result
      );


      completed++;


      if(completed === files.length){

        renderPhotoPreview();

      }

    };


    reader.onerror = function(){

      completed++;


      if(completed === files.length){

        renderPhotoPreview();

      }

    };


    reader.readAsDataURL(file);

  });

}


function renderPhotoPreview(){

  const box =
    document.getElementById(
      'photoPreview'
    );


  if(!box){
    return;
  }


  if(!selectedPhotos.length){

    box.innerHTML = '';

    return;
  }


  box.innerHTML =
    selectedPhotos.map(
      (src,index)=>`

        <div
          class="photo-preview"
        >

          <img
            src="${src}"
            alt="Foto ${index+1}"
          >

          <button
            type="button"
            onclick="removePhoto(${index})"
          >
            ×
          </button>

        </div>

      `
    ).join('');

}


function removePhoto(index){

  selectedPhotos.splice(
    index,
    1
  );

  renderPhotoPreview();

}


async function publishProduct(){

  if(!token){

    toast(
      'Inicia sessão primeiro.'
    );

    go('account');

    return;
  }


  try{

    if(!me){

      const response =
        await api('/api/me');

      me =
        response.user ||
        response;

    }


    if(!me){

      throw new Error(
        'Não foi possível carregar a tua conta.'
      );

    }


    if(me.role !== 'seller'){

      toast(
        'Muda primeiro para a conta de vendedor.'
      );

      return;
    }


    if(selectedPhotos.length < 5){

      toast(
        'Adiciona pelo menos 5 fotos reais.'
      );

      return;
    }


    if(selectedPhotos.length > 10){

      toast(
        'Usa no máximo 10 fotos.'
      );

      return;
    }


    const name =
      document
        .getElementById('productName')
        ?.value
        .trim();


    const price =
      Number(
        document
          .getElementById('productPrice')
          ?.value
      );


    const category =
      document
        .getElementById('productCategory')
        ?.value
        .trim();


    const description =
      document
        .getElementById('productDescription')
        ?.value
        .trim();


    if(!name){

      toast(
        'Indica o nome do produto.'
      );

      return;
    }


    if(!Number.isFinite(price) || price <= 0){

      toast(
        'Indica um preço válido.'
      );

      return;
    }


    if(!category){

      toast(
        'Seleciona uma categoria.'
      );

      return;
    }


    if(description.length < 15){

      toast(
        'A descrição deve ter pelo menos 15 caracteres.'
      );

      return;
    }


    const button =
      document.getElementById(
        'publishProductBtn'
      );


    if(button){

      button.disabled = true;

      button.textContent =
        'A publicar...';

    }


    const response =
      await api('/api/products',{

        method:'POST',

        body:JSON.stringify({

          name,

          price,

          category,

          description,

          images:
            selectedPhotos.slice(0,10)

        })

      });


    if(!response){

      throw new Error(
        'O servidor não confirmou a publicação.'
      );

    }


    toast(
      'Produto publicado com sucesso! 🎉'
    );


    selectedPhotos = [];


    setTimeout(()=>{

      loadHome();

    },700);


  }catch(e){

    toast(
      e.message ||
      'Não foi possível publicar o produto.'
    );


    const button =
      document.getElementById(
        'publishProductBtn'
      );


    if(button){

      button.disabled = false;

      button.textContent =
        '📤 Publicar produto';

    }

  }

}

      box.innerHTML = `
        <div class="empty small">

          para este produto.
        </div>
      `;

      return;
    }


    const total =
      reviews.reduce(
        (sum,r)=>
          sum + Number(r.rating || 0),
        0
      );


    const average =
      reviews.length
      ? total / reviews.length
      : 0;


    box.innerHTML = `

      <div class="review-summary">

        <strong>
          ⭐ ${average.toFixed(1)}
        </strong>

        <span>
          ${reviews.length}
          avaliação${reviews.length===1?'':'ões'}
        </span>

      </div>


      ${reviews.slice(0,10).map(
        review=>`

          <div class="review">

            <div class="review-head">

              <strong>
                ${esc(
                  review.user?.name ||
                  review.userName ||
                  review.buyerName ||
                  'Utilizador'

              <span>
                ${'⭐'.repeat(
                  Math.max(
                    1,
                    Math.min(
                      5,
                      Number(review.rating || 0)
                    )
                  )
                )}
              </span>

            </div>


            ${
              review.comment
              ? `
                <p class="small">
                  ${esc(review.comment)}
                </p>
              `
              : ''
            }

          </div>

        `
      ).join('')}

    `;


  }catch(e){

    const box =
      document.getElementById(
        'reviewsBox'
      );


    if(box){

      box.innerHTML = `
        <div class="small">
          Não foi possível carregar
          as avaliações.
        </div>
      `;

    }

  }

}

async function submitReview(productId){

  const rating =
    Number(
      document
        .getElementById('reviewRating')
        ?.value
    );


  const comment =
    document
      .getElementById('reviewComment')
      ?.value
      .trim() || '';


  if(
    !Number.isInteger(rating) ||
    rating < 1 ||
    rating > 5
  ){

    toast(
      'Seleciona uma classificação válida.'
    );

    return;
  }


  try{

    await api('/api/reviews',{

      method:'POST',

      body:JSON.stringify({

        productId,

        rating,

        comment

      })

    });


    closeModal();


    toast(
      'Avaliação enviada com sucesso ⭐'
    );


    await openProduct(productId);


  }catch(e){

    toast(
      e.message ||
      'Não foi possível enviar a avaliação.'
    );

  }

}

    let score =
      Number(
        me?.score ??
        me?.kuanzaScore ??
        me?.kuanza_score ??
        0

    if(!Number.isFinite(score)){
      score = 0;

    score =
      Math.max(
        0,

async function submitAuth(event,mode){

  if(event){
    event.preventDefault();
  }


  const email =
    document
      .getElementById('authEmail')
      ?.value
      .trim()
      .toLowerCase();


  const password =
    document
      .getElementById('authPassword')
      ?.value || '';


  const name =
    document
      .getElementById('authName')
      ?.value
      .trim() || '';


  const errorBox =
    document.getElementById(
      'authError'
    );


  const button =
    document.getElementById(
      'authButton'
    );


  if(errorBox){

    errorBox.innerHTML = '';

  }


  if(!email){

    if(errorBox){

      errorBox.innerHTML =
        `<div class="error">
          Introduz o teu email.
        </div>`;

    }

    return;
  }


  if(!email.includes('@')){

    if(errorBox){

      errorBox.innerHTML =
        `<div class="error">
          Introduz um email válido.
        </div>`;

    }

    return;
  }


  if(password.length < 6){

    if(errorBox){

      errorBox.innerHTML =
        `<div class="error">
          A palavra-passe deve ter pelo menos 6 caracteres.
        </div>`;

    }

    return;
  }


  if(mode === 'register' && name.length < 2){

    if(errorBox){

      errorBox.innerHTML =
        `<div class="error">
          Introduz o teu nome.
        </div>`;

    }

    return;
  }


  try{

    if(button){

      button.disabled = true;

      button.textContent =
        mode === 'register'
        ? 'A criar conta...'
        : 'A entrar...';

    }


    const body = {

      email,

      password

    };


    if(mode === 'register'){

      body.name = name;

    }


    const response =
      await api(
        mode === 'register'
        ? '/api/register'
        : '/api/login',
        {

          method:'POST',

          body:JSON.stringify(body)

        }
      );


    const receivedToken =
      response?.token ||
      response?.accessToken ||
      response?.data?.token ||
      '';


    if(!receivedToken){

      throw new Error(
        'O servidor não devolveu uma sessão válida.'
      );

    }


    token = receivedToken;


    localStorage.setItem(
      'kuanza_token',
      token
    );


    localStorage.setItem(
      'klToken',
      token
    );


    const meResponse =
      await api('/api/me');


    me =
      meResponse?.user ||
      meResponse;


    if(!me){

      throw new Error(
        'Não foi possível validar a sessão.'
      );

    }


    toast(
      mode === 'register'
      ? 'Conta criada com sucesso ✓'
      : 'Login efetuado com sucesso ✓'
    );


    await loadAccount();


  }catch(e){

    token = '';

    localStorage.removeItem(
      'kuanza_token'
    );

    localStorage.removeItem(
      'klToken'
    );


    if(errorBox){

      errorBox.innerHTML =
        `<div class="error">
          ${esc(
            e.message ||
            'Não foi possível concluir a operação.'
          )}
        </div>`;

    }


    toast(
      e.message ||
      'Erro de autenticação.'
    );


  }finally{

    if(button){

      button.disabled = false;

      button.textContent =
        mode === 'register'
        ? 'Criar conta'
        : 'Entrar';

    }

  }

}

/* =========================================================
   MUDAR COMPRADOR / VENDEDOR
   ========================================================= */

async function switchRole(){

  if(!token){

    toast(
      'Inicia sessão primeiro.'
    );

    go('account');

    return;
  }


  try{

    const current =
      await api('/api/me');


    me =
      current?.user ||
      current;


    if(!me){

      throw new Error(
        'Não foi possível carregar a conta.'
      );

    }


    const newRole =
      me.role === 'seller'
      ? 'buyer'
      : 'seller';


    const response =
      await api(
        '/api/me/role',
        {

          method:'PATCH',

          body:JSON.stringify({

            role:newRole

          })

        }
      );


    const returnedUser =
      response?.user ||
      response;


    if(
      returnedUser &&
      returnedUser.role &&
      returnedUser.role !== newRole
    ){

      throw new Error(
        'O servidor não confirmou a mudança de conta.'
      );

    }


    const fresh =
      await api('/api/me');


    me =
      fresh?.user ||
      fresh;


    if(
      !me ||
      me.role !== newRole
    ){

      throw new Error(
        'A mudança de conta não foi confirmada.'
      );

    }


    toast(
      newRole === 'seller'
      ? 'Agora és vendedor ✓'
      : 'Agora és comprador ✓'
    );


    await loadAccount();


  }catch(e){

    toast(
      e.message ||
      'Não foi possível mudar o tipo de conta.'
    );

  }

}

          <span>
            ❌ Cancelamentos
          </span>

          <strong>
            ${cancelled}
          </strong>

        </div>

      </div>

    `;


  }catch(e){

    toast(
      e.message ||
      'Não foi possível carregar o desempenho.'
    );

  }

}

/* =========================================================
   CHAT
   ========================================================= */

async function startChatWithSeller(
  sellerId
){

  if(!token){

    toast(
      'Inicia sessão para conversar com o vendedor.'
    );

    go('account');

    return;
  }


  if(!sellerId){

    toast(
      'Vendedor não encontrado.'
    );

    return;
  }


  try{

    const response =
      await api(
        '/api/conversations',
        {

          method:'POST',

          body:JSON.stringify({

            userId:sellerId,

            sellerId:sellerId,

            productId:
              currentProduct?.id ||
              null

          })

        }
      );


    const conversation =
      response?.conversation ||
      response;


    if(
      conversation?.id
    ){

      currentConversation =
        conversation;

      go('chats');

      setTimeout(
        ()=>{
          loadChats();
        },
        100
      );

      return;
    }


    go('chats');


  }catch(e){

    toast(
      e.message ||
      'Não foi possível iniciar a conversa.'
    );

  }

}


async function loadChats(){

  const root =
    document.getElementById(
      'appContent'
    );


  if(!token){

    go('account');

    return;
  }


  root.innerHTML = `

    <div class="page">

      <div class="section-title">

        <h2>
          💬 Conversas
        </h2>

      </div>

      <div id="chatList">

        <div class="empty">
          A carregar...
        </div>

      </div>

    </div>

  `;


  try{

    const response =
      await api(
        '/api/conversations'
      );


    const conversations =
      Array.isArray(response)
      ? response
      : (
          response.conversations ||
          response.items ||
          []
        );


    const box =
      document.getElementById(
        'chatList'
      );


    if(!conversations.length){

      box.innerHTML = `
        <div class="empty">

          <div class="emoji">
            💬
          </div>

          <strong>
            Ainda não tens conversas.
          </strong>

          <p class="small mt">
            Abre um produto e fala
            com o vendedor.
          </p>

        </div>
      `;

      return;
    }


    box.innerHTML =
      conversations.map(
        conversation=>`

          <div
            class="chat-item"
            onclick="openChat('${esc(
              conversation.id
            )}')"
          >

            <div class="chat-avatar">
              💬
            </div>

            <div>

              <strong>
                ${esc(
                  conversation.otherUser?.name ||
                  conversation.other?.name ||
                  conversation.seller?.name ||
                  'Utilizador'
                )}
              </strong>

              <div class="small">
                ${esc(
                  conversation.lastMessage?.text ||
                  conversation.lastMessage ||
                  'Abrir conversa'
                )}
              </div>

            </div>

          </div>

        `
      ).join('');


  }catch(e){

    document.getElementById(
      'chatList'
    ).innerHTML = `

      <div class="empty">
        ${esc(
          e.message ||
          'Não foi possível carregar as conversas.'
        )}
      </div>

    `;

  }

}


async function openChat(id){

  try{

    const response =
      await api(
        '/api/conversations/' +
        encodeURIComponent(id)
      );


    currentConversation =
      response?.conversation ||
      response;


    const messages =
      Array.isArray(
        currentConversation?.messages
      )
      ? currentConversation.messages
      : [];


    const root =
      document.getElementById(
        'appContent'
      );


    root.innerHTML = `

      <div class="page">

        <button
          class="btn btn-secondary mb"
          onclick="loadChats()"
        >
          ← Conversas
        </button>


        <h2>
          💬 Conversa
        </h2>


        <div
          id="messagesBox"
          class="messages"
        >

          ${
            messages.length
            ? messages.map(
                message=>`

                  <div
                    class="message ${
                      String(
                        message.senderId ||
                        message.userId ||
                        ''
                      ) ===
                      String(me?.id || '')
                      ? 'mine'
                      : ''
                    }"
                  >

                    ${
                      message.text
                      ? esc(message.text)
                      : ''
                    }

                    ${
                      message.offer
                      ? `
                        <strong>
                          Oferta:
                          ${money(
                            message.offer
                          )}
                        </strong>
                      `
                      : ''
                    }

                  </div>

                `
              ).join('')
            : `
              <div class="empty">
                Ainda não existem mensagens.
              </div>
            `
          }

        </div>


        <div class="chat-input-row">

          <input
            id="chatMessage"
            class="input"
            type="text"
            placeholder="Escreve uma mensagem..."
          >

          <button
            class="btn btn-primary"
            onclick="sendChatMessage()"
          >
            Enviar
          </button>

        </div>


        <div class="chat-input-row mt">

          <input
            id="chatOffer"
            class="input"
            type="number"
            min="1"
            placeholder="Valor da oferta em Kz"
          >

          <button
            class="btn btn-secondary"
            onclick="sendOffer()"
          >
            💰 Oferta
          </button>

        </div>

      </div>

    `;


  }catch(e){

    toast(
      e.message ||
      'Não foi possível abrir a conversa.'
    );

  }

}


async function sendChatMessage(){

  const input =
    document.getElementById(
      'chatMessage'
    );


  const text =
    input?.value
    .trim() || '';


  if(!text){

    toast(
      'Escreve uma mensagem.'
    );

    return;
  }


  if(!currentConversation?.id){

    toast(
      'Conversa inválida.'
    );

    return;
  }


  try{

    await api(
      '/api/conversations/' +
      encodeURIComponent(
        currentConversation.id
      ) +
      '/messages',
      {

        method:'POST',

        body:JSON.stringify({

          text

        })

      }
    );


    await openChat(
      currentConversation.id
    );


  }catch(e){

    toast(
      e.message ||
      'Não foi possível enviar a mensagem.'
    );

  }

}


async function sendOffer(){

  const input =
    document.getElementById(
      'chatOffer'
    );


  const amount =
    Number(
      input?.value
    );


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    toast(
      'Indica um valor válido.'
    );

    return;
  }


  if(!currentConversation?.id){

    toast(
      'Conversa inválida.'
    );

    return;
  }


  try{

    await api(
      '/api/conversations/' +
      encodeURIComponent(
        currentConversation.id
      ) +
      '/messages',
      {

        method:'POST',

        body:JSON.stringify({

          text:'',

          offer:amount

        })

      }
    );


    await openChat(
      currentConversation.id
    );


  }catch(e){

    toast(
      e.message ||
      'Não foi possível enviar a oferta.'
    );

  }

}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(content){

  const modal =
    document.getElementById(
      'modal'
    );


  const box =
    document.getElementById(
      'modalBox'
    );


  if(!modal || !box){

    toast(
      'Janela indisponível.'
    );

    return;

  }


  box.innerHTML =
    content || '';


  modal.classList.remove(
    'hidden'
  );

}


function closeModal(){

  const modal =
    document.getElementById(
      'modal'
    );


  if(modal){

    modal.classList.add(
      'hidden'
    );

  }

}


function modalBackground(event){

  if(
    event.target?.id ===
    'modal'
  ){

    closeModal();

  }

}

/* =========================================================
   FUNÇÕES DE APOIO
   ========================================================= */

function saveFavorites(){

  try{

    localStorage.setItem(
      'kuanza_favorites',
      JSON.stringify(
        favorites
      )
    );

  }catch(e){}

}


function saveCart(){

  try{

    localStorage.setItem(
      'kuanza_cart',
      JSON.stringify(
        cart
      )
    );

  }catch(e){}

}


function loadLocalData(){

  try{

    const savedFavorites =
      JSON.parse(
        localStorage.getItem(
          'kuanza_favorites'
        ) || '[]'
      );


    favorites =
      Array.isArray(
        savedFavorites
      )
      ? savedFavorites
      : [];

  }catch(e){

    favorites = [];

  }


  try{

    const savedCart =
      JSON.parse(
        localStorage.getItem(
          'kuanza_cart'
        ) || '[]'
      );


    cart =
      Array.isArray(
        savedCart
      )
      ? savedCart.filter(
          item =>
            item &&
            item.id
        )
      : [];

  }catch(e){

    cart = [];

  }

}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function boot(){

  loadLocalData();


  token =
    localStorage.getItem(
      'kuanza_token'
    ) ||
    localStorage.getItem(
      'klToken'
    ) ||
    '';


  if(token){

    try{

      const response =
        await api('/api/me');


      me =
        response?.user ||
        response;


      if(!me){

        throw new Error(
          'Sessão inválida.'
        );

      }

    }catch(e){

      token = '';

      me = null;

      localStorage.removeItem(
        'kuanza_token'
      );

      localStorage.removeItem(
        'klToken'
      );

    }

  }


  await loadHome();

}


document.addEventListener(
  'DOMContentLoaded',
  boot
);

</script>
